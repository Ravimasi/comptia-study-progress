s to run multiple VMs on a workstation with an i7 quad-core CPU, 4 GB DDR3 RAM, a 512 GB SSD, and a gigabit NIC. What should be upgraded to support multiple simultaneous VMs?\",\"a\":\"The RAM (memory) — increase it substantially\"},{\"id\":\"f270\",\"domainId\":3,\"q\":\"A technician upgrading RAM from DDR3 to DDR4 must verify what first?\",\"a\":\"That the motherboard/CPU supports DDR4 — DDR3 and DDR4 are not physically or electrically interchangeable\"},{\"id\":\"f271\",\"domainId\":3,\"q\":\"A traveling video production workstation needs maximum RAM, an 8-core CPU, a dedicated GPU, and redundant SSDs. What PSU characteristic is MOST important?\",\"a\":\"An auto-switching (universal) power supply supporting multiple input voltage ranges (100-240V)\"},{\"id\":\"f272\",\"domainId\":3,\"q\":\"A user wants to print a large job on both sides of the paper. Which setting should be changed?\",\"a\":\"Enable duplex printing\"},{\"id\":\"f273\",\"domainId\":3,\"q\":\"A workstation has four identical memory sticks in a board marked \\\"quad-channel support,\\\" with all 4 slots populated. How many channels are being used?\",\"a\":\"4 (quad-channel is active)\"},{\"id\":\"f274\",\"domainId\":3,\"q\":\"A workstation runs slowly when many applications are open simultaneously. What upgrade would help?\",\"a\":\"Add more RAM\"},{\"id\":\"f275\",\"domainId\":3,\"q\":\"After upgrading to Windows 11, a laptop is slow due to increased memory requirements. What should be installed?\",\"a\":\"Additional laptop-compatible RAM (SODIMM) matching the motherboard's supported type/speed\"},{\"id\":\"f276\",\"domainId\":3,\"q\":\"An auto shop needs a printer to create carbon-copy invoices on tractor-fed, multi-part paper. Which printer type should be used?\",\"a\":\"An impact (dot-matrix) printer\"},{\"id\":\"f277\",\"domainId\":3,\"q\":\"An eSports build needs to be extremely fast but also quiet. Which cooling mechanism should be installed?\",\"a\":\"Liquid cooling (a closed-loop AIO cooler)\"},{\"id\":\"f278\",\"domainId\":3,\"q\":\"How fast will a PCIe x8 expansion card run if installed in a PCIe x16 slot?\",\"a\":\"At its rated x8 speed (the card, not the slot, determines the speed)\"},{\"id\":\"f279\",\"domainId\":3,\"q\":\"If troubleshooting a S.M.A.R.T. error on a customer's PC, which device is being investigated?\",\"a\":\"The hard disk drive (HDD/SSD storage device)\"},{\"id\":\"f280\",\"domainId\":3,\"q\":\"Old CRT displays are being replaced with a lower-voltage, energy-efficient type with no backlight. What display technology should be selected?\",\"a\":\"OLED\"},{\"id\":\"f281\",\"domainId\":3,\"q\":\"Roughly how many volts of electrical charge are applied to the drum of a laser printer?\",\"a\":\"Around -600 volts (negative charge)\"},{\"id\":\"f282\",\"domainId\":3,\"q\":\"What are the dimensions of a MicroATX motherboard?\",\"a\":\"9.6\\\" x 9.6\\\" (24.4 cm x 24.4 cm)\"},{\"id\":\"f283\",\"domainId\":3,\"q\":\"What are the two MOST important considerations when selecting a replacement power supply for a system with multiple drives and a dedicated GPU? (Select TWO)\",\"a\":\"Total wattage required and the number/type of available connectors (PCIe power, SATA power)\"},{\"id\":\"f284\",\"domainId\":3,\"q\":\"What are the two most important components to install in a NAS built exclusively as a company file server? (Select TWO)\",\"a\":\"Multiple hard drives configured in a redundant RAID array, and a reliable (Gigabit) network interface\"},{\"id\":\"f285\",\"domainId\":3,\"q\":\"What connector type is found on a Thunderbolt 3 cable?\",\"a\":\"USB-C (USB Type-C)\"},{\"id\":\"f286\",\"domainId\":3,\"q\":\"What describes how many times the image on a monitor changes per second?\",\"a\":\"The refresh rate (measured in Hz)\"},{\"id\":\"f287\",\"domainId\":3,\"q\":\"What is the MOST common connector type on the back of a printer for a USB cable?\",\"a\":\"USB Type-B\"},{\"id\":\"f288\",\"domainId\":3,\"q\":\"What is the correct order of steps in a laser printer's imaging process?\",\"a\":\"Processing, Charging, Exposing, Developing, Transferring, Fusing, Cleaning\"},{\"id\":\"f289\",\"domainId\":3,\"q\":\"What is the key difference between RAID 5 and RAID 6?\",\"a\":\"RAID 6 uses dual (distributed) parity and can survive two simultaneous drive failures, while RAID 5 uses single parity and survives only one\"},{\"id\":\"f290\",\"domainId\":3,\"q\":\"What is the name for a computer system designed to perform one specific, dedicated function?\",\"a\":\"An embedded system\"},{\"id\":\"f291\",\"domainId\":3,\"q\":\"What is the purpose of Secure Boot?\",\"a\":\"It ensures only trusted, digitally signed OS bootloaders/drivers load at startup, preventing rootkits and unauthorized OS loading\"},{\"id\":\"f292\",\"domainId\":3,\"q\":\"What is the term for a system no longer directly supported by its vendor?\",\"a\":\"End-of-life (EOL) / legacy system\"},{\"id\":\"f293\",\"domainId\":3,\"q\":\"What is true of a dedicated video card in a computer system?\",\"a\":\"It has its own dedicated GPU and VRAM, separate from the system CPU/RAM, offloading graphics processing from the main system\"},{\"id\":\"f294\",\"domainId\":3,\"q\":\"What is used to transfer ink to paper in an impact printer?\",\"a\":\"An inked ribbon\"},{\"id\":\"f295\",\"domainId\":3,\"q\":\"What material is first applied to a CPU during installation to help draw excess heat away from the processor?\",\"a\":\"Thermal paste (thermal compound)\"},{\"id\":\"f296\",\"domainId\":3,\"q\":\"What onboard hardware component should a laptop have for fast, secure full-disk encryption?\",\"a\":\"A TPM (Trusted Platform Module)\"},{\"id\":\"f297\",\"domainId\":3,\"q\":\"What should be installed to BEST build a dedicated gaming/beta-testing machine? (Select FOUR)\",\"a\":\"A dedicated (discrete) GPU, a multi-core CPU, high-speed/ample RAM, and a high-wattage power supply\"},{\"id\":\"f298\",\"domainId\":3,\"q\":\"What should be verified before installing a new dedicated GPU expansion card?\",\"a\":\"That the PSU provides sufficient wattage and the correct power connectors, and that the motherboard/case has a free PCIe x16 slot with clearance\"},{\"id\":\"f299\",\"domainId\":3,\"q\":\"What term describes a tool that tells a printer how pages are laid out and what their content is?\",\"a\":\"A print driver, using a page description language (PDL) such as PCL or PostScript\"},{\"id\":\"f300\",\"domainId\":3,\"q\":\"What type of cable is most commonly used to terminate a serial connection to a modem?\",\"a\":\"An RS-232 (DB-9) serial cable\"},{\"id\":\"f301\",\"domainId\":3,\"q\":\"What type of connector can be inserted into its port in either direction without damaging it?\",\"a\":\"USB-C (USB Type-C)\"},{\"id\":\"f302\",\"domainId\":3,\"q\":\"What type of connector provides power to an internal hard drive from the PSU using a 4-pin connector?\",\"a\":\"A Molex connector\"},{\"id\":\"f303\",\"domainId\":3,\"q\":\"What type of memory uses temporary hard drive space when physical RAM is insufficient?\",\"a\":\"Virtual memory (the page/swap file)\"},{\"id\":\"f304\",\"domainId\":3,\"q\":\"When choosing a storage controller card for a backup file server to minimize downtime, what consideration is MOST important?\",\"a\":\"Support for hot-swappable drives (and RAID with hot-spare capability)\"},{\"id\":\"f305\",\"domainId\":3,\"q\":\"When replacing an internal 5400 RPM HDD, which cable(s) should you use?\",\"a\":\"A SATA data cable and a SATA power connector\"},{\"id\":\"f306\",\"domainId\":3,\"q\":\"When using a laser printer, what is used to transfer the toner image onto the paper?\",\"a\":\"Toner, moved by electrostatic charge via the transfer roller/belt\"},{\"id\":\"f307\",\"domainId\":3,\"q\":\"Which CPU technology lets a processor utilize two logical cores per physical core?\",\"a\":\"Hyper-Threading (Intel HT)\"},{\"id\":\"f308\",\"domainId\":3,\"q\":\"Which PSU feature is most important for a server requiring 99.999% uptime?\",\"a\":\"A redundant, hot-swappable power supply configuration\"},{\"id\":\"f309\",\"domainId\":3,\"q\":\"Which RAID configuration gives the highest speed and uses 100% of available drive space, with no redundancy required?\",\"a\":\"RAID 0\"},{\"id\":\"f310\",\"domainId\":3,\"q\":\"Which RAID configuration provides maximum fault tolerance, surviving the simultaneous failure of two drives?\",\"a\":\"RAID 6\"},{\"id\":\"f311\",\"domainId\":3,\"q\":\"Which RAID level requires at least three hard disks to operate?\",\"a\":\"RAID 5\"},{\"id\":\"f312\",\"domainId\":3,\"q\":\"Which cache level is the smallest and fastest, located closest to the CPU core?\",\"a\":\"L1 cache\"},{\"id\":\"f313\",\"domainId\":3,\"q\":\"Which component of a color laser printer combines the 4 colors before printing them to paper in one pass?\",\"a\":\"The (intermediate) transfer belt\"},{\"id\":\"f314\",\"domainId\":3,\"q\":\"Which computer case has the smallest form factor?\",\"a\":\"A Mini-ITX/SFF (small form factor) case\"},{\"id\":\"f315\",\"domainId\":3,\"q\":\"Which connector type connects a TV tuner to a wall jack using coaxial cable?\",\"a\":\"An F-connector (F-type)\"},{\"id\":\"f316\",\"domainId\":3,\"q\":\"Which connector type is most commonly used to terminate a copper twisted-pair Ethernet cable?\",\"a\":\"RJ45\"},{\"id\":\"f317\",\"domainId\":3,\"q\":\"Which connector type is used to terminate a household telephone cable?\",\"a\":\"RJ11\"},{\"id\":\"f318\",\"domainId\":3,\"q\":\"Which cooling solution would MOST efficiently dissipate heat from a high-end multi-GPU mining/workstation rig?\",\"a\":\"Liquid (closed-loop or custom) cooling\"},{\"id\":\"f319\",\"domainId\":3,\"q\":\"Which display type gives the best color accuracy at a 60 Hz refresh rate for video editing?\",\"a\":\"An IPS (In-Plane Switching) display\"},{\"id\":\"f320\",\"domainId\":3,\"q\":\"Which expansion bus technology uses lanes with point-to-point communication paths between components?\",\"a\":\"PCIe (PCI Express)\"},{\"id\":\"f321\",\"domainId\":3,\"q\":\"Which hard drive form factor supports a 15,000 RPM drive with a SATA connector for a desktop computer?\",\"a\":\"3.5-inch form factor\"},{\"id\":\"f322\",\"domainId\":3,\"q\":\"Which is the BEST option to ensure sufficient power/speed for a workstation built to brute-force hash digests?\",\"a\":\"A system with one or more powerful GPUs for parallel hash-cracking computation\"},{\"id\":\"f323\",\"domainId\":3,\"q\":\"Which laptop display type supports a high refresh rate of 120 Hz or 144 Hz for gaming?\",\"a\":\"A high-refresh-rate TN or fast IPS display\"},{\"id\":\"f324\",\"domainId\":3,\"q\":\"Which laptop hard drive form factor connects internally via a Micro-SATA connection?\",\"a\":\"A 1.8-inch drive\"},{\"id\":\"f325\",\"domainId\":3,\"q\":\"Which laser printer component applies an electric charge to the paper so it attracts toner during imaging?\",\"a\":\"The transfer roller/corona wire\"},{\"id\":\"f326\",\"domainId\":3,\"q\":\"Which memory mode creates two independent 64-bit pathways to achieve 128-bit data transfer per transaction?\",\"a\":\"Dual-channel memory mode\"},{\"id\":\"f327\",\"domainId\":3,\"q\":\"Which memory module would you choose to replace a laptop's failed RAM?\",\"a\":\"A SODIMM matching the laptop's supported RAM type/speed\"},{\"id\":\"f328\",\"domainId\":3,\"q\":\"Which metric should you consider to compare the performance of an SSD or HDD?\",\"a\":\"IOPS (Input/Output Operations Per Second) and read/write throughput speed\"},{\"id\":\"f329\",\"domainId\":3,\"q\":\"Which motherboard connection is most likely used to add a wireless network adapter expansion card?\",\"a\":\"A PCIe slot (or an internal M.2 slot for smaller wireless cards)\"},{\"id\":\"f330\",\"domainId\":3,\"q\":\"Which motherboard form factor is BEST for a small home theater PC (HTPC)?\",\"a\":\"Mini-ITX\"},{\"id\":\"f331\",\"domainId\":3,\"q\":\"Which motherboard form factor measures 6.7\\\" x 6.7\\\" (17 cm x 17 cm)?\",\"a\":\"Mini-ITX\"},{\"id\":\"f332\",\"domainId\":3,\"q\":\"Which of the following is NOT a cause of power issues?\",\"a\":\"A purely software problem (e.g., an application crash) — unlike brownouts, blackouts, sags, and surges\"},{\"id\":\"f333\",\"domainId\":3,\"q\":\"Which optical disc type can store a 20 GB file on a single piece of media?\",\"a\":\"A Blu-ray Disc (BD)\"},{\"id\":\"f334\",\"domainId\":3,\"q\":\"Which page description language produces higher-quality output at the expense of speed?\",\"a\":\"PostScript\"},{\"id\":\"f335\",\"domainId\":3,\"q\":\"Which printer configuration setting controls the size of paper used for a print job?\",\"a\":\"The media/paper size setting\"},{\"id\":\"f336\",\"domainId\":3,\"q\":\"Which printer setting lets a user print a spreadsheet horizontally to fit more columns on the page?\",\"a\":\"Landscape orientation\"},{\"id\":\"f337\",\"domainId\":3,\"q\":\"Which statement about an eSATA connection is correct?\",\"a\":\"eSATA delivers native SATA speeds externally but does not supply power to the device (a separate power source is required), and cable runs are limited to about 2 meters\"},{\"id\":\"f338\",\"domainId\":3,\"q\":\"Which storage device form factor is NOT used in laptops?\",\"a\":\"3.5-inch desktop drive form factor\"},{\"id\":\"f339\",\"domainId\":3,\"q\":\"Which storage type uses a NAND chipset mounted directly on the motherboard instead of a mechanical spinning drive?\",\"a\":\"eMMC storage (or an M.2 NVMe SSD)\"},{\"id\":\"f340\",\"domainId\":3,\"q\":\"Which tool removes the jacket/sheathing from a wire when building a cable?\",\"a\":\"A wire stripper (cable stripper)\"},{\"id\":\"f341\",\"domainId\":3,\"q\":\"Which type of RAM module should be selected to add 8 GB of RAM to a laptop?\",\"a\":\"A SODIMM\"},{\"id\":\"f342\",\"domainId\":3,\"q\":\"Which type of hard disk drive would be installed in a low-end office desktop?\",\"a\":\"A standard 5400/7200 RPM SATA HDD (economical, lower-performance)\"},{\"id\":\"f343\",\"domainId\":3,\"q\":\"Which type of hard disk drive would provide the best performance in a gaming workstation?\",\"a\":\"A high-RPM (10,000-15,000 RPM) HDD, or ideally an SSD\"},{\"id\":\"f344\",\"domainId\":3,\"q\":\"Which type of laptop display uses a fluorescent backlight to illuminate the image?\",\"a\":\"A CCFL-backlit LCD display\"},{\"id\":\"f345\",\"domainId\":3,\"q\":\"Which type of memory allows a server to keep working even if data corruption occurs within a memory module?\",\"a\":\"ECC (Error-Correcting Code) RAM\"},{\"id\":\"f346\",\"domainId\":3,\"q\":\"Which type of power supply lets the installer attach/remove cables as needed to reduce clutter?\",\"a\":\"A modular power supply\"},{\"id\":\"f347\",\"domainId\":3,\"q\":\"Which version of USB can operate at speeds up to 5 Gbps?\",\"a\":\"USB 3.0 (USB 3.1 Gen 1)\"},{\"id\":\"f348\",\"domainId\":3,\"q\":\"Which virtualization technology is supported by most modern Intel processors?\",\"a\":\"Intel VT-x\"},{\"id\":\"f349\",\"domainId\":4,\"q\":\"\\\"Shadow PC\\\" is a virtualized Windows gaming PC accessed from anywhere in the cloud. What type of service is this?\",\"a\":\"DaaS (Desktop as a Service)\"},{\"id\":\"f350\",\"domainId\":4,\"q\":\"A CRM app is offered to multiple businesses as a subscription, each with separate data but shared infrastructure. Which cloud model best fits?\",\"a\":\"SaaS (multi-tenant Software as a Service)\"},{\"id\":\"f351\",\"domainId\":4,\"q\":\"A VM running an older legacy OS works, but the software freezes/runs slowly. What is the likely cause, and the fix?\",\"a\":\"The VM isn't allocated enough resources (CPU/RAM) — increase the VM's allocated resources\"},{\"id\":\"f352\",\"domainId\":4,\"q\":\"A VM running in sandbox mode crashed after a software patch installation. What should the technician do next?\",\"a\":\"Revert the VM to a snapshot taken before the patch was applied\"},{\"id\":\"f353\",\"domainId\":4,\"q\":\"A VM with dynamic disk allocation frequently runs out of storage during testing. What is the likely cause, and the fix?\",\"a\":\"Dynamically allocated disks grow as needed and can exhaust host storage — free up/add host storage, or resize/compact the virtual disk\"},{\"id\":\"f354\",\"domainId\":4,\"q\":\"A cloud app uses excessive CPU even during low traffic, raising costs. How can elasticity fix this?\",\"a\":\"Configure auto-scaling so resources automatically scale down/deallocate when demand is low\"},{\"id\":\"f355\",\"domainId\":4,\"q\":\"A cloud backup bill shows an unexpected spike due to \\\"egress traffic.\\\" What does this refer to?\",\"a\":\"Data transferred out of (downloaded from) the cloud provider's network — outbound traffic that providers typically charge for\"},{\"id\":\"f356\",\"domainId\":4,\"q\":\"A cloud service automatically adds resources during a traffic spike. What cloud characteristic is this?\",\"a\":\"Elasticity (rapid elasticity/on-demand scalability)\"},{\"id\":\"f357\",\"domainId\":4,\"q\":\"A company purchases cloud storage dedicated solely to its own use due to privacy concerns. Which cloud type is this?\",\"a\":\"Private cloud\"},{\"id\":\"f358\",\"domainId\":4,\"q\":\"A company uses both on-premise storage and cloud-based storage together. What type of cloud is this?\",\"a\":\"Hybrid cloud\"},{\"id\":\"f359\",\"domainId\":4,\"q\":\"A company wants cloud accounting to cut costs, but some worry about sharing financial data with other companies. What solution addresses both concerns?\",\"a\":\"A private (or community) cloud, dedicated to the organization rather than shared multi-tenant infrastructure\"},{\"id\":\"f360\",\"domainId\":4,\"q\":\"A cross-platform virtualization environment fails to launch after a platform update. What should the technician do FIRST?\",\"a\":\"Check for compatibility issues with the update (verify virtualization is still enabled in BIOS/UEFI, and consider rolling back or reinstalling the virtualization platform)\"},{\"id\":\"f361\",\"domainId\":4,\"q\":\"A cybersecurity analyst uses a sandboxed VM to analyze a file that attempts unauthorized system changes and network access. Why is the sandbox critical here?\",\"a\":\"It isolates and contains the malicious file, preventing it from affecting the host system or the real network during analysis\"},{\"id\":\"f362\",\"domainId\":4,\"q\":\"A developer wants to test an app on multiple OSes without buying separate computers, running on top of their existing Windows desktop. Which virtualization technology should they use?\",\"a\":\"A Type 2 (hosted) hypervisor, such as VMware Workstation or VirtualBox\"},{\"id\":\"f363\",\"domainId\":4,\"q\":\"A small company purchases on-demand cloud storage from a commercial provider like Google Drive. What type of cloud is this?\",\"a\":\"Public cloud\"},{\"id\":\"f364\",\"domainId\":4,\"q\":\"An IaaS database server has frequent downtime during peak hours due to heavy resource usage. What is the most effective solution?\",\"a\":\"Scale up/out the allocated resources (or enable auto-scaling/elasticity) for the server\"},{\"id\":\"f365\",\"domainId\":4,\"q\":\"An organization needs to run a Windows-based inventory app on Linux-based infrastructure. Which solution would BEST meet this requirement?\",\"a\":\"Run a Windows VM on a hypervisor hosted on the Linux infrastructure (or use an application compatibility layer)\"},{\"id\":\"f366\",\"domainId\":4,\"q\":\"How can a company reduce software licensing costs while keeping remote access to its application server?\",\"a\":\"Implement Remote Desktop Services (terminal services)/thin clients so multiple users share one licensed application instance\"},{\"id\":\"f367\",\"domainId\":4,\"q\":\"How does application virtualization resolve running a legacy app incompatible with the current OS?\",\"a\":\"It streams/runs the app in an isolated virtual environment/container on the client, without installing it natively on the incompatible OS\"},{\"id\":\"f368\",\"domainId\":4,\"q\":\"How does cross-platform application virtualization let a legacy Windows app run on macOS?\",\"a\":\"It runs/streams the Windows app in an isolated virtualized environment on macOS, without requiring a full native Windows installation\"},{\"id\":\"f369\",\"domainId\":4,\"q\":\"Microsoft 365 provides software accessed via a browser without local installation. What type of cloud service is this?\",\"a\":\"SaaS (Software as a Service)\"},{\"id\":\"f370\",\"domainId\":4,\"q\":\"Migrating an on-premise email server to a vendor-hosted web solution like Google Workspace/Gmail is an example of what cloud model?\",\"a\":\"SaaS (Software as a Service, delivered via public cloud)\"},{\"id\":\"f371\",\"domainId\":4,\"q\":\"Running multiple VMs on a Type II hypervisor, adding one more VM causes the host and all VMs to perform poorly with high CPU/memory usage. What should be done FIRST?\",\"a\":\"Review and reduce/reallocate the CPU and RAM assigned to the VMs (or add more host RAM) rather than adding more VMs\"},{\"id\":\"f372\",\"domainId\":4,\"q\":\"Signing up for a cloud provider's programming environment to develop a mobile app is an example of which service type?\",\"a\":\"PaaS (Platform as a Service)\"},{\"id\":\"f373\",\"domainId\":4,\"q\":\"Using virtual machines to provision workstations for corporate users is an example of what technology?\",\"a\":\"VDI (Virtual Desktop Infrastructure)\"},{\"id\":\"f374\",\"domainId\":4,\"q\":\"What best explains the characteristics of a Type II hypervisor?\",\"a\":\"It installs and runs as an application on top of an existing host operating system\"},{\"id\":\"f375\",\"domainId\":4,\"q\":\"What does VDI stand for?\",\"a\":\"Virtual Desktop Infrastructure\"},{\"id\":\"f376\",\"domainId\":4,\"q\":\"What is a key advantage of using containers for a web app that must run consistently across dev, test, and production?\",\"a\":\"Containers package the app with its dependencies, so it runs identically regardless of differences in the underlying environment\"},{\"id\":\"f377\",\"domainId\":4,\"q\":\"What is a key characteristic of a Type I hypervisor?\",\"a\":\"It runs directly on the physical hardware (bare-metal) without needing a host operating system\"},{\"id\":\"f378\",\"domainId\":4,\"q\":\"What is a key characteristic of a Type II hypervisor?\",\"a\":\"It runs as an application on top of a host operating system (instead of directly on hardware)\"},{\"id\":\"f379\",\"domainId\":4,\"q\":\"What is a key feature of IaaS that makes it suitable for flexible traffic scaling?\",\"a\":\"IaaS offers on-demand, scalable compute/storage resources (rapid elasticity) without owning physical hardware\"},{\"id\":\"f380\",\"domainId\":4,\"q\":\"What is a primary benefit of using VDI?\",\"a\":\"Centralized management (patching, security, deployment) of desktops at the datacenter, rather than distributed across individual devices\"},{\"id\":\"f381\",\"domainId\":4,\"q\":\"What is the primary architectural difference between Type 1 and Type 2 hypervisors?\",\"a\":\"A Type 1 hypervisor runs directly on the physical hardware (bare-metal); a Type 2 hypervisor runs as an application on top of a host operating system\"},{\"id\":\"f382\",\"domainId\":4,\"q\":\"What is the primary benefit of using virtual network segmentation in a virtualization environment?\",\"a\":\"It isolates VM traffic into separate logical networks (improving security, reducing broadcast domains) without needing additional physical network hardware\"},{\"id\":\"f383\",\"domainId\":4,\"q\":\"What is the primary characteristic of multitenancy in a public cloud environment?\",\"a\":\"Multiple customers (tenants) share the same physical infrastructure while their data and resources remain logically isolated from each other\"},{\"id\":\"f384\",\"domainId\":4,\"q\":\"What is the purpose of containers in virtualization?\",\"a\":\"They provide lightweight, OS-level virtualization that packages an app with its dependencies to run consistently, without a full separate guest OS\"},{\"id\":\"f385\",\"domainId\":4,\"q\":\"What key cloud computing characteristic allows resources to be allocated/deallocated automatically as needed?\",\"a\":\"Elasticity (rapid elasticity)\"},{\"id\":\"f386\",\"domainId\":4,\"q\":\"What should you install on your computer to support a new VR headset for VR gaming?\",\"a\":\"A capable dedicated/discrete GPU that meets the headset's VR requirements\"},{\"id\":\"f387\",\"domainId\":4,\"q\":\"Which best describes a Type I hypervisor?\",\"a\":\"It runs directly on the host's physical hardware (bare-metal), managing virtual machines without an underlying host OS\"},{\"id\":\"f388\",\"domainId\":4,\"q\":\"Which cloud computing concept replaces a customer's local applications/programs with cloud-based resources?\",\"a\":\"SaaS (Software as a Service)\"},{\"id\":\"f389\",\"domainId\":4,\"q\":\"Which cloud computing concept replaces the hardware/software needed to create and test new applications from a customer's environment?\",\"a\":\"PaaS (Platform as a Service)\"},{\"id\":\"f390\",\"domainId\":4,\"q\":\"Which cloud concept focuses on replacing physical hardware at a customer's location with cloud-based resources?\",\"a\":\"IaaS (Infrastructure as a Service)\"},{\"id\":\"f391\",\"domainId\":4,\"q\":\"Which cloud concept lets users store files in the cloud when local device space is low, and retrieve them once space is available again?\",\"a\":\"Cloud (online) storage / cloud file sync with local storage offloading\"},{\"id\":\"f392\",\"domainId\":4,\"q\":\"Which cloud deployment model is dedicated to a single organization for enhanced security and control?\",\"a\":\"Private cloud\"},{\"id\":\"f393\",\"domainId\":4,\"q\":\"Which cloud deployment/pricing model uses a pay-as-you-go structure for IT services?\",\"a\":\"Public cloud\"},{\"id\":\"f394\",\"domainId\":4,\"q\":\"Which cloud model allows both onsite systems and cloud services to work together seamlessly?\",\"a\":\"Hybrid cloud\"},{\"id\":\"f395\",\"domainId\":4,\"q\":\"Which cloud model only allows your company's own employees to use the service, keeping it most secure from outsiders?\",\"a\":\"Private cloud\"},{\"id\":\"f396\",\"domainId\":4,\"q\":\"Which cloud service characteristic lets you get more storage/resources added as fast as possible?\",\"a\":\"Rapid elasticity / on-demand self-service\"},{\"id\":\"f397\",\"domainId\":4,\"q\":\"Which cloud service model is best suited for using pre-built applications without managing infrastructure?\",\"a\":\"SaaS (Software as a Service)\"},{\"id\":\"f398\",\"domainId\":4,\"q\":\"Which cloud service type provides instant, quickly-provisioned access to servers and switches managed over the internet?\",\"a\":\"IaaS (Infrastructure as a Service)\"},{\"id\":\"f399\",\"domainId\":4,\"q\":\"Which option would you use to configure PXE for remote OS imaging during a deployment?\",\"a\":\"Enable/select PXE (network) boot in the BIOS/UEFI boot order settings\"},{\"id\":\"f400\",\"domainId\":4,\"q\":\"Which scenario would MOST benefit from application virtualization?\",\"a\":\"Running a legacy or incompatible app by streaming it in an isolated environment, without installing it natively on the current OS\"},{\"id\":\"f401\",\"domainId\":4,\"q\":\"Which type of Virtual Desktop reduces capital expenditures, with hardware maintained by the cloud provider?\",\"a\":\"Hosted/cloud-based VDI (DaaS — Desktop as a Service)\"},{\"id\":\"f402\",\"domainId\":4,\"q\":\"Which type of cloud service provides an end-to-end application solution for a recurring monthly or yearly fee?\",\"a\":\"SaaS (Software as a Service)\"},{\"id\":\"f403\",\"domainId\":4,\"q\":\"Why is a VM in sandbox mode ideal for testing a new application safely?\",\"a\":\"It isolates the test environment from the host OS/data, so crashes, bugs, or malware in the app can't affect the physical machine\"},{\"id\":\"f404\",\"domainId\":5,\"q\":\"100 Windows 10 PCs need to be locked so no one can change the boot order or boot an unauthorized OS. What feature should be enabled?\",\"a\":\"A BIOS/UEFI supervisor (administrator) password to lock boot order settings\"},{\"id\":\"f405\",\"domainId\":5,\"q\":\"A MacBook can't print to the office's network printer, while Windows workstations print fine. What should be done to resolve John's issue?\",\"a\":\"Install the correct macOS-compatible printer driver (or use AirPrint if supported)\"},{\"id\":\"f406\",\"domainId\":5,\"q\":\"A PC shows \\\"No bootable device found\\\" with multiple hard drives, a DVD in the optical drive, and a USB drive plugged in. What would MOST likely resolve this?\",\"a\":\"Remove the non-bootable USB/DVD media and/or correct the BIOS/UEFI boot order to boot from the correct hard drive\"},{\"id\":\"f407\",\"domainId\":5,\"q\":\"A PC won't power on; power cables are secure and the PSU (set to 110V) tests OK. What is the NEXT troubleshooting step?\",\"a\":\"Test/replace the front-panel power button and its motherboard connector, or swap in a known-good PSU to isolate the fault\"},{\"id\":\"f408\",\"domainId\":5,\"q\":\"A RAID 5 drive is reporting S.M.A.R.T. errors but the array still shows no degradation. What should the administrator do FIRST?\",\"a\":\"Back up the data immediately and proactively schedule replacement of the flagged drive before it fails\"},{\"id\":\"f409\",\"domainId\":5,\"q\":\"A RAID 5 file server alerts \\\"RAID is degraded... Physical Disk 3 has failed.\\\" What is the BEST fix?\",\"a\":\"Replace the failed physical disk and allow the array to rebuild using parity\"},{\"id\":\"f410\",\"domainId\":5,\"q\":\"A RAID 5 workstation is slower than normal, though diagnostics pass; clicking noises are heard from the array. What is the MOST likely cause?\",\"a\":\"A drive within the array is beginning to fail (the clicking) and degrading performance — identify and replace it\"},{\"id\":\"f411\",\"domainId\":5,\"q\":\"A Roku connected via HDMI shows \\\"Unauthorized content.\\\" What should be done to fix this?\",\"a\":\"Use an HDMI cable/port that supports HDCP (or enable HDCP on the TV/source)\"},{\"id\":\"f412\",\"domainId\":5,\"q\":\"A USB printer was working earlier but now fails to print, with no changes reported. What should you check NEXT?\",\"a\":\"Check the print spooler/queue for a stuck or paused print job (restart the Print Spooler service if needed)\"},{\"id\":\"f413\",\"domainId\":5,\"q\":\"A VoIP phone's Cat6a patch cable has been repeatedly rolled over by a chair and looks flattened. What is the most likely cause of the connectivity issue?\",\"a\":\"The cable's internal wiring/twisted pairs were physically damaged by being crushed — replace the cable\"},{\"id\":\"f414\",\"domainId\":5,\"q\":\"A Windows workstation crashes with certain applications, showing a BSOD. What is the most likely cause?\",\"a\":\"A faulty or incompatible device driver, or failing RAM\"},{\"id\":\"f415\",\"domainId\":5,\"q\":\"A classroom projector displays bright, correctly-sized artifacts obscuring parts of the image. What should you do FIRST?\",\"a\":\"Check/reseat the video cable connection (loose or damaged cable is the most common cause of on-screen artifacts)\"},{\"id\":\"f416\",\"domainId\":5,\"q\":\"A classroom projector's image is dim but clear and correctly positioned. What is the FIRST thing to do to brighten it?\",\"a\":\"Adjust the projector's brightness setting/mode (check for eco-mode) before considering a bulb replacement\"},{\"id\":\"f417\",\"domainId\":5,\"q\":\"A client's computer keeps rebooting itself without warning. What is the BEST action to investigate?\",\"a\":\"Check the Windows Event Viewer logs for error details around the reboot times (and check for overheating/power issues)\"},{\"id\":\"f418\",\"domainId\":5,\"q\":\"A color laser printer prints small vector graphics fine but fails 60-70% through large bitmap photos (400-800 MB). What is MOST likely the reason?\",\"a\":\"The printer doesn't have enough onboard memory (RAM) to fully process such large raster/bitmap jobs\"},{\"id\":\"f419\",\"domainId\":5,\"q\":\"A computer has a noisy whining sound and no dust is visible on the fans. What should you try next?\",\"a\":\"Replace (or lubricate) the failing fan — the whine is typically a worn fan bearing\"},{\"id\":\"f420\",\"domainId\":5,\"q\":\"A computer keeps booting to the incorrect hard drive. What should you do?\",\"a\":\"Change the boot order/boot device priority in BIOS/UEFI to select the correct drive\"},{\"id\":\"f421\",\"domainId\":5,\"q\":\"A computer keeps losing track of time and date. What is MOST likely the cause?\",\"a\":\"The CMOS battery is dying and needs replacement\"},{\"id\":\"f422\",\"domainId\":5,\"q\":\"A computer won't boot, makes no sound, and smells of burning plastic. Which tool should you use to diagnose it?\",\"a\":\"A multimeter (to test the power supply's output) — after a visual inspection for obvious damage\"},{\"id\":\"f423\",\"domainId\":5,\"q\":\"A customer smells a foul (non-burning) odor from inside their PC. What would you expect to find?\",\"a\":\"A leaking/bloated capacitor, or biological contamination (mold, dead insect/rodent) inside the case\"},{\"id\":\"f424\",\"domainId\":5,\"q\":\"A customer's VGA cable has a few broken pins. What would MOST likely happen if they used it to connect their monitor?\",\"a\":\"Depending on which pins are broken, they may lose specific colors, see a distorted/garbled image, or get no display at all\"},{\"id\":\"f425\",\"domainId\":5,\"q\":\"A customer's system clock keeps resetting, causing date/time discrepancies. What component should be investigated?\",\"a\":\"The CMOS battery (likely dying)\"},{\"id\":\"f426\",\"domainId\":5,\"q\":\"A domain controller takes a long time to boot and makes steady clicking noises from the hard drive. What is the BEST action to speed up boot time?\",\"a\":\"Replace the failing hard drive (ideally with an SSD)\"},{\"id\":\"f427\",\"domainId\":5,\"q\":\"A drawing tablet stylus feels scratchy and occasionally fails to register strokes, requiring harder presses. What is MOST likely the cause?\",\"a\":\"A worn stylus nib/tip (replace it) or a dirty tablet surface\"},{\"id\":\"f428\",\"domainId\":5,\"q\":\"A grinding noise is traced to the power supply's fan, not the hard drive. What is the BEST fix?\",\"a\":\"Replace the power supply (the fan bearing is failing)\"},{\"id\":\"f429\",\"domainId\":5,\"q\":\"A home theater projector keeps turning off a few minutes after a new bulb was installed. What are the MOST likely causes? (Select TWO)\",\"a\":\"Overheating (dirty filter/blocked vents) and an improperly seated or incompatible replacement bulb\"},{\"id\":\"f430\",\"domainId\":5,\"q\":\"A laptop display is extremely dim even at max brightness, but the image is visible when a flashlight is pointed at the screen. What component should be replaced?\",\"a\":\"The backlight (or its inverter)\"},{\"id\":\"f431\",\"domainId\":5,\"q\":\"A laptop doesn't appear to charge when plugged into a hotel room outlet. What should be tried FIRST?\",\"a\":\"Try a different electrical outlet (and verify the power adapter/cable) before assuming a hardware fault\"},{\"id\":\"f432\",\"domainId\":5,\"q\":\"A laptop has a foul odor coming from it. What is MOST likely the cause?\",\"a\":\"A swollen, leaking, or damaged battery\"},{\"id\":\"f433\",\"domainId\":5,\"q\":\"A laptop keyboard displays \\\"he3p\\\" instead of \\\"help\\\" and \\\"n6ne\\\" instead of \\\"none.\\\" What is the MOST likely cause?\",\"a\":\"Num Lock is enabled, causing the embedded numeric keypad to override certain letter keys\"},{\"id\":\"f434\",\"domainId\":5,\"q\":\"A laptop monitor shows black bars on the left/right with a squashed, distorted image. What is MOST likely the cause?\",\"a\":\"The display resolution/aspect ratio is set incorrectly — reset it to the display's native resolution\"},{\"id\":\"f435\",\"domainId\":5,\"q\":\"A laptop shuts down every time it's moved, even after the HDD, RAM, LCD ribbon cable, and battery were reseated. What is MOST likely causing this?\",\"a\":\"A loose or failing internal power connector (DC jack) or battery connector on the motherboard\"},{\"id\":\"f436\",\"domainId\":5,\"q\":\"A laptop shuts down intermittently, faster during processor-intensive tasks, with no unusual odors. What is MOST likely the cause?\",\"a\":\"Overheating (thermal shutdown) — check cooling/vents/fans and thermal paste\"},{\"id\":\"f437\",\"domainId\":5,\"q\":\"A laptop with an i7 CPU, 16 GB RAM, and a 500 GB 5400 RPM HDD boots and loads programs slowly. What upgrade would BEST improve performance?\",\"a\":\"Replace the HDD with an SSD\"},{\"id\":\"f438\",\"domainId\":5,\"q\":\"A laptop works fine at its desk but powers off when moved to the conference room. What is MOST likely the cause?\",\"a\":\"It's running on a failing/depleted battery in the conference room (no power adapter connected there)\"},{\"id\":\"f439\",\"domainId\":5,\"q\":\"A laptop's built-in webcam is enabled in BIOS but not detected by the OS. What is the NEXT troubleshooting step?\",\"a\":\"Update or reinstall the webcam driver\"},{\"id\":\"f440\",\"domainId\":5,\"q\":\"A laptop's motherboard has failed and won't power on, but the user needs spreadsheets stored on it. What should you do?\",\"a\":\"Remove the internal hard drive and connect it to another computer via a USB enclosure/adapter to retrieve the files\"},{\"id\":\"f441\",\"domainId\":5,\"q\":\"A laptop's screen image is displayed upside down. What is the BEST fix?\",\"a\":\"Change the display orientation setting in Windows (Display Settings), or check for an accidental orientation hotkey (Ctrl+Alt+Arrow)\"},{\"id\":\"f442\",\"domainId\":5,\"q\":\"A laptop's touchscreen flickers between too bright and too dim only when plugged in at a coffee shop outlet, not at the hotel. What is the MOST likely cause?\",\"a\":\"The coffee shop outlet is supplying unstable/dirty power (poor grounding or voltage fluctuation) affecting the laptop\"},{\"id\":\"f443\",\"domainId\":5,\"q\":\"A laptop's wired connection isn't working, and the NIC light is steady instead of blinking. What is MOST likely the issue?\",\"a\":\"A physical link exists but no data is being passed — check the cable/switch port configuration or a duplex mismatch\"},{\"id\":\"f444\",\"domainId\":5,\"q\":\"A large laser printer's output has begun showing a double/ghost image. Which component is most likely at fault?\",\"a\":\"The imaging drum (worn or not being properly cleaned/erased between cycles)\"},{\"id\":\"f445\",\"domainId\":5,\"q\":\"A laser printer makes a crinkling sound and prints images at an angle. What should the technician do to fix this?\",\"a\":\"Check/clean or replace the paper feed and fuser rollers, and verify the paper tray guides are properly aligned\"},{\"id\":\"f446\",\"domainId\":5,\"q\":\"A laser printer's output has a white streak running across the page. What should be done to fix this?\",\"a\":\"Clean or replace the imaging drum (or check for an obstruction/low toner causing the streak)\"},{\"id\":\"f447\",\"domainId\":5,\"q\":\"A loopback plug test shows the Ethernet port is sending packets but not receiving them. What does this indicate, and what's next?\",\"a\":\"A receive-side hardware fault (bad receive pins/transceiver) — replace/repair the NIC or port\"},{\"id\":\"f448\",\"domainId\":5,\"q\":\"A macOS workstation keeps crashing with certain apps, showing a spinning rainbow pinwheel. What is the most likely cause?\",\"a\":\"Insufficient system resources (RAM) or a hung/unresponsive process/application causing the system to become unresponsive\"},{\"id\":\"f449\",\"domainId\":5,\"q\":\"A multifunction laser printer still shows a paper jam error after the jammed paper was manually pulled out. What should you try FIRST?\",\"a\":\"Open all the printer's covers/trays and check for leftover torn paper fragments still stuck in the paper path\"},{\"id\":\"f450\",\"domainId\":5,\"q\":\"A network printer's pages have begun showing a dust-like coating when handled. Which component should be replaced?\",\"a\":\"The fuser assembly (failing to properly bond/melt the toner)\"},{\"id\":\"f451\",\"domainId\":5,\"q\":\"A network-enabled multi-function printer connected via CAT5e has issues every time there's a power outage. What should you do to resolve this?\",\"a\":\"Connect the printer to a UPS (battery backup with surge protection)\"},{\"id\":\"f452\",\"domainId\":5,\"q\":\"A new build POSTs successfully (fans spin, LEDs light, POST completes) but shows \\\"bootable device not found.\\\" What did the technician likely forget to connect?\",\"a\":\"The SATA data cable between the hard drive and the motherboard\"},{\"id\":\"f453\",\"domainId\":5,\"q\":\"A new build's fans don't spin, the hard drive doesn't spin, and the motherboard's LEDs remain unlit. What did the technician likely forget to connect?\",\"a\":\"The power supply's main 24-pin motherboard power connector (or the PSU itself isn't switched on/plugged in)\"},{\"id\":\"f454\",\"domainId\":5,\"q\":\"A new build's fans spin and LEDs light, but POST never completes and the monitor stays blank. What did the technician likely forget to connect?\",\"a\":\"The CPU power connector (4/8-pin EPS12V) to the motherboard, or the RAM isn't fully seated\"},{\"id\":\"f455\",\"domainId\":5,\"q\":\"A new color laser printer (only ~50 pages printed) prints the logo's blue incorrectly compared to the screen. What is MOST likely the problem?\",\"a\":\"The printer needs color calibration\"},{\"id\":\"f456\",\"domainId\":5,\"q\":\"A new wireless printer is configured on the guest Wi-Fi network; drivers are installed, but a test page won't print. What is the likely cause?\",\"a\":\"The guest network isolates client devices from each other/the main LAN, so the workstation can't reach the printer — connect the printer to the main network instead\"},{\"id\":\"f457\",\"domainId\":5,\"q\":\"A newly installed hard drive isn't recognized in BIOS/UEFI, though cables are verified correctly connected. What should BEST solve this?\",\"a\":\"Check BIOS/UEFI settings to ensure the SATA port/drive is enabled, and try a different SATA port/cable or update firmware\"},{\"id\":\"f458\",\"domainId\":5,\"q\":\"A newly installed home theater projector shows odd debris on the screen. What should you do to correct this?\",\"a\":\"Clean the projector's lens (dust/debris is on the lens or inside the optical path, not the actual screen)\"},{\"id\":\"f459\",\"domainId\":5,\"q\":\"A print job on cardstock smears, but the same job on regular paper doesn't smear. What should you do NEXT?\",\"a\":\"Adjust the printer's paper-type setting for heavier stock (increases fuser heat/dwell time to properly bond toner)\"},{\"id\":\"f460\",\"domainId\":5,\"q\":\"A print job produces no output and no errors appear in the taskbar's printer icon. What should you try FIRST?\",\"a\":\"Check whether the printer is set offline, or restart the Print Spooler service\"},{\"id\":\"f461\",\"domainId\":5,\"q\":\"A print job to the Sales printer produces nothing, but the same job prints fine on the Customer Service printer. What should you check FIRST?\",\"a\":\"Whether the Sales printer is offline, paused, or has a stuck print queue\"},{\"id\":\"f462\",\"domainId\":5,\"q\":\"A printer worked during setup (test page printed), but later a user gets \\\"access denied\\\" when printing, even after restarts. What MOST likely caused this?\",\"a\":\"The user's print permissions on the printer were changed or removed — check the printer's security/sharing permissions\"},{\"id\":\"f463\",\"domainId\":5,\"q\":\"A projector goes blank after 24 minutes, works again after a break, then fails after 4 more minutes. What is MOST likely wrong?\",\"a\":\"The projector is overheating and shutting down for thermal protection (clogged vents/failing fan, or a failing lamp)\"},{\"id\":\"f464\",\"domainId\":5,\"q\":\"A projector's image is trapezoidal (72\\\" wide at top, 66\\\" at bottom) even though resolution settings are correct. What setting should be adjusted?\",\"a\":\"Keystone correction\"},{\"id\":\"f465\",\"domainId\":5,\"q\":\"A replacement laptop screen arrived with no instructions and no manufacturer manual is available. What is the BEST course of action?\",\"a\":\"Look up a third-party repair guide/video (e.g., iFixit) for that model\"},{\"id\":\"f466\",\"domainId\":5,\"q\":\"A second OS was installed; \\\"Operating System Not Found\\\" appears even though boot.ini looks correct. What is MOST likely the cause?\",\"a\":\"The boot configuration data (BCD)/bootloader is corrupted or misconfigured for the new OS (boot.ini only applies to legacy BIOS boot, not UEFI)\"},{\"id\":\"f467\",\"domainId\":5,\"q\":\"A shared network printer accessed via a print server stops printing after the first of three documents. What is your FIRST step?\",\"a\":\"Restart the Print Spooler service on the print server (and clear the stuck queue)\"},{\"id\":\"f468\",\"domainId\":5,\"q\":\"A shared printer failed with a 2-week wait for replacement; a manager's USB printer could serve 12 employees, no wired jacks are free, but a wireless AP exists. What's the BEST solution?\",\"a\":\"Connect the PC with the shared USB printer to the wireless network (or use a wireless print server) so others can print to it over Wi-Fi\"},{\"id\":\"f469\",\"domainId\":5,\"q\":\"A slow workstation shows a S.M.A.R.T. error during boot-up. What should you do FIRST?\",\"a\":\"Back up the data immediately\"},{\"id\":\"f470\",\"domainId\":5,\"q\":\"A video editor's workstation makes loud clicking noises loading apps/editing video; fans were already replaced but the noise persists. What should you do NEXT?\",\"a\":\"Back up the data and replace the failing hard drive\"},{\"id\":\"f471\",\"domainId\":5,\"q\":\"A workstation has multiple S.M.A.R.T. errors, a loud clicking noise on boot, and the OS fails to load. What is MOST likely the problem?\",\"a\":\"The hard drive is failing mechanically (the \\\"click of death\\\") — replace it\"},{\"id\":\"f472\",\"domainId\":5,\"q\":\"A workstation in a closed wooden cabinet reboots intermittently with no pattern, though memory and cables are fine. What is MOST likely the cause?\",\"a\":\"Overheating due to poor ventilation inside the enclosed cabinet\"},{\"id\":\"f473\",\"domainId\":5,\"q\":\"A workstation loads a PXE-based OS instead of booting into Windows on reboot. What should you do next?\",\"a\":\"Check and correct the BIOS/UEFI boot order — the system is set to boot from the network (PXE) before the local drive\"},{\"id\":\"f474\",\"domainId\":5,\"q\":\"A workstation loses accurate time overnight whenever it's powered off, requiring a manual reset each morning. What is MOST likely causing this?\",\"a\":\"The CMOS battery is dying\"},{\"id\":\"f475\",\"domainId\":5,\"q\":\"A workstation runs briefly then shuts down unexpectedly; the cooling fans can be heard humming. What is MOST likely the issue?\",\"a\":\"Overheating — check CPU fan/heatsink seating, thermal paste, and dust buildup restricting airflow\"},{\"id\":\"f476\",\"domainId\":5,\"q\":\"A workstation shows \\\"bootable device cannot be found\\\"; UEFI doesn't recognize the hard drive, but cables are fine. What is MOST likely the issue?\",\"a\":\"The drive's SATA mode (AHCI/RAID) setting in UEFI is misconfigured, or the drive itself has failed\"},{\"id\":\"f477\",\"domainId\":5,\"q\":\"A workstation won't boot and displays \\\"OS not found.\\\" What is the MOST likely fix?\",\"a\":\"Check/correct the boot order in BIOS/UEFI and verify the bootable drive is properly connected\"},{\"id\":\"f478\",\"domainId\":5,\"q\":\"After Windows Updates installed successfully overnight, the network connection shows \\\"limited.\\\" What rollback action should be performed?\",\"a\":\"Uninstall the recently installed Windows/driver update to restore network connectivity\"},{\"id\":\"f479\",\"domainId\":5,\"q\":\"After a laptop lost power unexpectedly, it's stuck at 800x600 and the normal 1920x1080 option is missing from Display Settings. What is the cause?\",\"a\":\"The video/graphics driver was corrupted or reverted to a generic driver and needs to be reinstalled/updated\"},{\"id\":\"f480\",\"domainId\":5,\"q\":\"After a reboot, the desktop background shows only a few hundred unique colors. Which setting should be reconfigured?\",\"a\":\"The display's color depth/quality (bit depth) setting\"},{\"id\":\"f481\",\"domainId\":5,\"q\":\"After cloning a display to a second monitor, the second monitor's text appears twice as large. What should you configure?\",\"a\":\"Match the display resolution/DPI scaling settings for both monitors\"},{\"id\":\"f482\",\"domainId\":5,\"q\":\"After installing a high-end PCIe x16 graphics card, the computer makes odd noises and shows \\\"no source\\\" on the monitor. What is MOST likely the issue?\",\"a\":\"The GPU's power connector isn't properly attached, or the PSU doesn't provide enough wattage for the card\"},{\"id\":\"f483\",\"domainId\":5,\"q\":\"After moving from France to the US and plugging in via a power adapter, the computer's screen stays blank and the fans don't spin. What is MOST likely the problem?\",\"a\":\"The power supply's voltage selector switch is set for the wrong region's voltage (e.g., 230V instead of 120V), or a non-auto-switching adapter is being used incorrectly\"},{\"id\":\"f484\",\"domainId\":5,\"q\":\"After replacing a CPU, the system boots but shuts itself down after about a minute. What step was MOST likely forgotten?\",\"a\":\"Applying thermal paste and/or connecting the CPU fan/heatsink power connector — the system is overheating and shutting down for protection\"},{\"id\":\"f485\",\"domainId\":5,\"q\":\"After replacing a failed 5400 RPM drive with a 7200 RPM drive in a RAID 5 array, the array remains degraded. What is the most likely cause?\",\"a\":\"The array rebuild was never initiated — the replacement drive must be added to the array and a rebuild started via the RAID controller\"},{\"id\":\"f486\",\"domainId\":5,\"q\":\"After testing with minimal components, a computer's fans spin but there is no display and no POST beep codes. What is MOST likely the cause?\",\"a\":\"The motherboard (or CPU) has failed\"},{\"id\":\"f487\",\"domainId\":5,\"q\":\"After turning off 65\\\" plasma TVs, the company logo remains faintly visible in the upper-left corner. What should you do?\",\"a\":\"This is image burn-in/retention from static content displayed too long; vary displayed content or use a screensaver going forward to prevent further burn-in (it's typically not fully reversible)\"},{\"id\":\"f488\",\"domainId\":5,\"q\":\"An 11-month-old laser printer with no maintenance and ~3,000 pages printed is fading. What is MOST likely the cause?\",\"a\":\"The toner cartridge is low and needs replacement (or a maintenance kit is overdue)\"},{\"id\":\"f489\",\"domainId\":5,\"q\":\"An external monitor's screen intermittently flashes and goes black for a second before reappearing. What is the most likely cause?\",\"a\":\"A loose or faulty video cable connection — reseat or replace the cable\"},{\"id\":\"f490\",\"domainId\":5,\"q\":\"An impact printer is creasing paper, risking jams. What might be causing this? (Choose TWO)\",\"a\":\"An incorrectly adjusted platen gap and misaligned paper feed/tractor guides\"},{\"id\":\"f491\",\"domainId\":5,\"q\":\"An impact printer's output goes from darker to lighter as the print head moves left to right. What is the MOST likely cause?\",\"a\":\"The ribbon is worn or unevenly inked — replace the ribbon\"},{\"id\":\"f492\",\"domainId\":5,\"q\":\"An inkjet printer prints images/text at an angle, and sometimes not at all. What should a technician perform to align it?\",\"a\":\"Run the printer's head alignment/calibration utility\"},{\"id\":\"f493\",\"domainId\":5,\"q\":\"How can you determine if TPM is enabled on a system?\",\"a\":\"Check the BIOS/UEFI settings, or run the TPM Management console (tpm.msc) in
