document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f809558c-bfbe-49ec-a535-260ba14cb774\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <meta name=\"viewport\" content=\"width=1280\">\n  <style>\n    body { margin: 0; font-family: Arial, sans-serif; }\n    * { box-sizing: border-box; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex; min-height:100vh; color:{{ theme.text }}; font-family:Arial, sans-serif; background:{{ theme.pageBg }};\">\n\n  <nav style=\"width:220px; flex-shrink:0; background:{{ theme.navBg }}; color:oklch(96% 0.01 60); padding:28px 16px; display:flex; flex-direction:column; gap:4px;\">\n    <div style=\"font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:oklch(70% 0.03 30); font-weight:700; padding:0 12px 20px;\">A+ Core 1<\u002Fdiv>\n    <button style=\"display:flex; align-items:center; gap:10px; text-align:left; border:none; background:{{ navBg.overview }}; color:inherit; padding:12px 12px; border-radius:8px; font-size:15px; cursor:pointer;\" sc-camel-on-click=\"{{ goOverview }}\">Overview<\u002Fbutton>\n    <button style=\"display:flex; align-items:center; gap:10px; text-align:left; border:none; background:{{ navBg.checklist }}; color:inherit; padding:12px 12px; border-radius:8px; font-size:15px; cursor:pointer;\" sc-camel-on-click=\"{{ goChecklist }}\">Checklist<\u002Fbutton>\n    <button style=\"display:flex; align-items:center; gap:10px; text-align:left; border:none; background:{{ navBg.practice }}; color:inherit; padding:12px 12px; border-radius:8px; font-size:15px; cursor:pointer;\" sc-camel-on-click=\"{{ goPractice }}\">Practice Questions<\u002Fbutton>\n    <button style=\"display:flex; align-items:center; gap:10px; text-align:left; border:none; background:{{ navBg.mock }}; color:inherit; padding:12px 12px; border-radius:8px; font-size:15px; cursor:pointer;\" sc-camel-on-click=\"{{ goMock }}\">Mock Exam<\u002Fbutton>\n    <button style=\"display:flex; align-items:center; gap:10px; text-align:left; border:1px solid oklch(40% 0.01 60); background:transparent; color:inherit; padding:10px 12px; border-radius:8px; font-size:13px; cursor:pointer; margin-top:14px;\" sc-camel-on-click=\"{{ toggleDark }}\">{{ darkModeLabel }}<\u002Fbutton>\n    <div style=\"margin-top:auto; padding:12px; font-size:12px; color:oklch(65% 0.02 60); line-height:1.5;\">220-1201 · 5 domains · 29 objectives<\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"flex:1; padding:36px 48px; max-width:960px;\">\n    <header style=\"margin-bottom:32px;\">\n      <h1 style=\"margin:0 0 4px; font-size:26px; font-weight:700;\">Study Progress Monitor<\u002Fh1>\n      <p style=\"margin:0; color:{{ theme.textSecondary }}; font-size:15px;\">CompTIA A+ Core 1 (220-1201)<\u002Fp>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <section>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px;\">\n          <div style=\"background:{{ theme.cardBg }}; border:1px solid {{ theme.cardBorder }}; border-radius:12px; padding:20px 24px;\">\n            <div style=\"font-size:13px; color:{{ theme.textSecondary }}; margin-bottom:8px;\">Checklist progress<\u002Fdiv>\n            <div style=\"font-size:34px; font-weight:700;\">{{ overallLabel }}<\u002Fdiv>\n            <div style=\"height:8px; background:{{ theme.trackBg }}; border-radius:5px; margin-top:12px; overflow:hidden;\">\n              <div style=\"height:100%; background:oklch(60% 0.15 30); border-radius:5px; width:{{ overallPercentStr }};\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:{{ theme.cardBg }}; border:1px solid {{ theme.cardBorder }}; border-radius:12px; padding:20px 24px;\">\n            <div style=\"font-size:13px; color:{{ theme.textSecondary }}; margin-bottom:8px;\">Practice quiz accuracy<\u002Fdiv>\n            <div style=\"font-size:34px; font-weight:700;\">{{ quizAccuracyLabel }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:{{ theme.textSecondary }}; margin-top:12px;\">{{ quizAnsweredLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"font-size:16px; font-weight:700; margin:0 0 14px;\">By domain<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <sc-for list=\"{{ domainsView }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <div style=\"background:{{ theme.cardBg }}; border:1px solid {{ theme.cardBorder }}; border-radius:10px; padding:16px 20px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;\">\n                <div style=\"font-weight:700; font-size:14px;\">{{ d.name }}<\u002Fdiv>\n                <div style=\"font-size:13px; color:{{ theme.textSecondary }};\">{{ d.weightLabel }} of exam · {{ d.countLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:7px; background:{{ theme.trackBg }}; border-radius:4px; overflow:hidden;\">\n                <div style=\"height:100%; background:oklch(60% 0.15 30); border-radius:4px; width:{{ d.percentStr }};\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isChecklist }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"display:flex; flex-direction:column; gap:20px;\">\n        <sc-for list=\"{{ domainsView }}\" as=\"d\" hint-placeholder-count=\"5\">\n          <div style=\"background:{{ theme.cardBg }}; border:1px solid {{ theme.cardBorder }}; border-radius:12px; padding:18px 22px;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;\">\n              <div style=\"font-weight:700; font-size:15px;\">{{ d.name }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:{{ theme.textSecondary }};\">{{ d.countLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:6px; background:{{ theme.trackBg }}; border-radius:4px; overflow:hidden; margin-bottom:14px;\">\n              <div style=\"height:100%; background:oklch(60% 0.15 30); border-radius:4px; width:{{ d.percentStr }};\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:2px;\">\n              <sc-for list=\"{{ d.objectives }}\" as=\"o\" hint-placeholder-count=\"6\">\n                <label style=\"display:flex; align-items:center; gap:12px; padding:9px 8px; border-radius:6px; cursor:pointer; font-size:14px;\" sc-camel-on-click=\"{{ o.onToggle }}\">\n                  <span style=\"width:18px; height:18px; border-radius:5px; border:1.5px solid {{ o.boxBorder }}; background:{{ o.boxBg }}; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:white; font-size:12px; font-weight:700;\">{{ o.checkMark }}<\u002Fspan>\n                  <span style=\"color:{{ o.textColor }};\">{{ o.id }} {{ o.text }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPractice }}\" hint-placeholder-val=\"{{ false }}\">\n      <section>\n        <div style=\"display:flex; gap:10px; margin-bottom:18px;\">\n          <button style=\"border:none; padding:9px 16px; border-radius:8px; font-size:14px; cursor:pointer; background:{{ modeBg.mc }}; color:{{ modeColor.mc }};\" sc-camel-on-click=\"{{ setModeMC }}\">Multiple Choice<\u002Fbutton>\n          <button style=\"border:none; padding:9px 16px; border-radius:8px; font-size:14px; cursor:pointer; background:{{ modeBg.flash }}; color:{{ modeColor.flash }};\" sc-camel-on-click=\"{{ setModeFlash }}\">Flashcards<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;\">\n          <sc-for list=\"{{ domainChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button style=\"border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.color }}; padding:6px 14px; border-radius:20px; font-size:13px; cursor:pointer; white-space:nowrap;\" sc-camel-on-click=\"{{ c.onClick }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isPracticeFlash }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;\">\n            <div style=\"font-size:13px; color:{{ theme.textSecondary }};\">{{ dueCountLabel }}<\u002Fdiv>\n            <div style=\"display:flex; gap:8px;\">\n              <button style=\"border:1px solid {{ theme.cardBorder }}; background:{{ theme.cardBg }}; color:{{ theme.text }}; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;\" sc-camel-on-click=\"{{ toggleDueOnly }}\">{{ dueToggleLabel }}<\u002Fbutton>\n              <button style=\"border:1px solid {{ theme.cardBorder }}; background:{{ theme.cardBg }}; color:{{ theme.text }}; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;\" sc-camel-on-click=\"{{ toggleImportPanel }}\">{{ importPanelLabel }}<\u002Fbutton>\n              <button style=\"border:1px solid {{ theme.cardBorder }}; background:{{ theme.cardBg }}; color:{{ theme.text }}; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;\" sc-camel-on-click=\"{{ shuffleFlash }}\">Shuffle<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showImportPanel }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:{{ theme.subtleBg }}; border-radius:10px; padding:16px 18px; margin-bottom:18px;\">\n              <p style=\"margin:0 0 8px; font-size:13px; color:{{ theme.textSecondary }};\">Paste one question per line, tab-separated: <span style=\"font-family:monospace;\">question [TAB] answer [TAB] domain tag (optional)<\u002Fspan><\u002Fp>\n              <textarea style=\"width:100%; min-height:110px; border:1px solid {{ theme.cardBorder }}; background:{{ theme.cardBg }}; color:{{ theme.text }}; border-radius:6px; padding:10px; font-size:13px; font-family:monospace; box-sizing:border-box;\" placeholder=\"What is the default gateway used for?\tRoutes traffic to networks outside the local subnet\tNetworking\" value=\"{{ importText }}\" sc-camel-on-change=\"{{ handleImportChange }}\"><\u002Ftextarea>\n              <div style=\"display:flex; gap:8px; margin-top:10px;\">\n                <button style=\"border:none; background:oklch(60% 0.15 30); color:white; padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer;\" sc-camel-on-click=\"{{ importFlashcards }}\">Import<\u002Fbutton>\n                <span style=\"font-size:12px; color:{{ theme.textSecondary }}; align-self:center;\">{{ importStatus }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasFlashcards }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:{{ theme.cardBg }}; border:1px solid {{ theme.cardBorder }}; border-radius:12px; padding:32px 28px; min-height:160px; display:flex; flex-direction:column; justify-content:center; cursor:pointer;\" sc-camel-on-click=\"{{ toggleFlashReveal }}\">\n              <div style=\"font-size:13px; color:{{ theme.textSecondary }}; margin-bottom:14px;\">{{ flashPositionLabel }}<\u002Fdiv>\n              <div style=\"font-size:17px; font-weight:600; line-height:1.5;\">{{ currentFlash.q }}<\u002Fdiv>\n              <sc-if value=\"{{ flashRevealed }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:16px; padding-top:16px; border-top:1px solid {{ theme.cardBorder }}; font-size:15px; color:oklch(30% 0.05 30); line-height:1.5;\">{{ currentFla           <div style=\"background:{{ theme.cardBg }}; border:1px solid {{ theme.cardBorder }}; border-radius:10px; padding:16px 20px;\">\n                <div style=\"font-size:14px; font-weight:600; margin-bottom:8px;\">{{ r.num }}. {{ r.text }}<\u002Fdiv>\n<sc-if value=\"{{ r.hasImage }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img ref=\"{{ r.imgRef }}\" style=\"max-width:100%; max-height:200px; border-radius:6px; margin-bottom:8px;\">\n                <\u002Fsc-if>\n                <div style=\"font-size:13px; color:{{ r.yourColor }};\">Your answer: {{ r.yourAnswer }}<\u002Fdiv>\n                <div style=\"font-size:13px; color:{{ theme.text }}; margin-top:4px;\">{{ r.correctLabel }}: {{ r.correctAnswer }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;shuffleQuestions&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Practice quiz&quot;}, &quot;progressDisplay&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;percent&quot;, &quot;options&quot;: [&quot;percent&quot;, &quot;count&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Checklist&quot;}}\">\nconst DOMAINS = [\n  { id: 1, name: \"1.0 Mobile Devices\", weight: 13, objectives: [\n    { id: \"1.1\", text: \"Laptop hardware installation & component replacement\" },\n    { id: \"1.2\", text: \"Laptop display types & configuration\" },\n    { id: \"1.3\", text: \"Mobile device accessories & ports\" },\n    { id: \"1.4\", text: \"Mobile device network connectivity (cellular, Wi-Fi, Bluetooth)\" },\n    { id: \"1.5\", text: \"Mobile device synchronization methods\" }\n  ]},\n  { id: 2, name: \"2.0 Networking\", weight: 23, objectives: [\n    { id: \"2.1\", text: \"TCP/IP protocols, ports & their purposes\" },\n    { id: \"2.2\", text: \"Networking hardware (routers, switches, access points)\" },\n    { id: \"2.3\", text: \"Wireless network types & configurations\" },\n    { id: \"2.4\", text: \"IP addressing (IPv4, IPv6, static/dynamic, APIPA)\" },\n    { id: \"2.5\", text: \"SOHO network setup (wired & wireless)\" },\n    { id: \"2.6\", text: \"Network configuration concepts (DNS, DHCP, VLAN, VPN)\" },\n    { id: \"2.7\", text: \"Network types & internet connection types\" },\n    { id: \"2.8\", text: \"Common networking tools\" }\n  ]},\n  { id: 3, name: \"3.0 Hardware\", weight: 25, objectives: [\n    { id: \"3.1\", text: \"Cable types & connectors\" },\n    { id: \"3.2\", text: \"RAM types & configurations\" },\n    { id: \"3.3\", text: \"Storage devices & RAID configurations\" },\n    { id: \"3.4\", text: \"Motherboards, CPUs & add-on cards\" },\n    { id: \"3.5\", text: \"Power supplies\" },\n    { id: \"3.6\", text: \"Peripheral devices\" },\n    { id: \"3.7\", text: \"Custom PC builds for specific use cases\" },\n    { id: \"3.8\", text: \"Printer installation & maintenance\" }\n  ]},\n  { id: 4, name: \"4.0 Virtualization & Cloud Computing\", weight: 11, objectives: [\n    { id: \"4.1\", text: \"Cloud computing concepts (SaaS, IaaS, PaaS, shared resources)\" },\n    { id: \"4.2\", text: \"Client-side virtualization (hypervisors, VMs, resource requirements)\" }\n  ]},\n  { id: 5, name: \"5.0 Hardware & Network Troubleshooting\", weight: 28, objectives: [\n    { id: \"5.1\", text: \"Troubleshooting methodology\" },\n    { id: \"5.2\", text: \"Motherboard, CPU, RAM & power troubleshooting\" },\n    { id: \"5.3\", text: \"Storage drive & RAID troubleshooting\" },\n    { id: \"5.4\", text: \"Video & display troubleshooting\" },\n    { id: \"5.5\", text: \"Mobile device troubleshooting\" },\n    { id: \"5.6\", text: \"Wired & wireless network troubleshooting\" }\n  ]}\n];\n\nconst QUESTIONS = [\n  { id: \"q1\", domainId: 1, text: \"Which port/connector is most commonly used to charge and connect modern Android smartphones?\", options: [\"USB-C\", \"Lightning\", \"Micro-USB\", \"FireWire\"], correct: 0, explain: \"Most current Android phones have moved to USB-C for both charging and data.\" },\n  { id: \"q2\", domainId: 1, text: \"A laptop's battery is swelling and won't hold a charge. What is the safest immediate action?\", options: [\"Keep using it until it fully fails\", \"Replace it with a new, compatible battery\", \"Puncture it to release pressure\", \"Charge it overnight to test capacity\"], correct: 1, explain: \"A swollen battery is a fire/chemical hazard and should be replaced, not charged or punctured.\" },\n  { id: \"q3\", domainId: 1, text: \"Which technology lets a smartphone share its cellular data connection with a laptop?\", options: [\"Tethering\", \"Synchronization\", \"NFC pairing\", \"Airplane mode\"], correct: 0, explain: \"Tethering shares a mobile device's data connection with another device, via USB, Wi-Fi, or Bluetooth.\" },\n  { id: \"q4\", domainId: 2, text: \"Which protocol automatically assigns IP addresses to devices on a network?\", options: [\"DNS\", \"DHCP\", \"SNMP\", \"SMTP\"], correct: 1, explain: \"DHCP (Dynamic Host Configuration Protocol) hands out IP addresses and network settings automatically.\" },\n  { id: \"q5\", domainId: 2, text: \"What is the purpose of a VLAN?\", options: [\"Encrypt traffic between two sites\", \"Logically segment a physical network into separate broadcast domains\", \"Translate domain names to IP addresses\", \"Assign public IP addresses automatically\"], correct: 1, explain: \"A VLAN splits one physical network into multiple logical broadcast domains.\" },\n  { id: \"q6\", domainId: 2, text: \"A device has an IP address starting with 169.254. What does this indicate?\", options: [\"It has a valid DHCP lease\", \"It is using APIPA because DHCP failed\", \"It is a public IP address\", \"It is configured for IPv6\"], correct: 1, explain: \"169.254.x.x is the APIPA range, self-assigned when a device can't reach a DHCP server.\" },\n  { id: \"q7\", domainId: 3, text: \"Which storage interface offers the fastest speeds by connecting directly to the PCIe bus?\", options: [\"SATA\", \"NVMe\", \"USB 2.0\", \"eSATA\"], correct: 1, explain: \"NVMe drives use the PCIe bus directly, giving far higher throughput than SATA-based storage.\" },\n  { id: \"q8\", domainId: 3, text: \"What is the main advantage of RAID 1?\", options: [\"Increased read/write speed only\", \"Data redundancy through disk mirroring\", \"Combines multiple disks into one large volume without redundancy\", \"Requires only one physical disk\"], correct: 1, explain: \"RAID 1 mirrors data across two or more disks, so the array survives a single disk failure.\" },\n  { id: \"q9\", domainId: 3, text: \"Which component regulates and supplies power to all parts of a desktop computer?\", options: [\"Motherboard\", \"Power supply unit (PSU)\", \"CPU\", \"RAM module\"], correct: 1, explain: \"The PSU converts AC power from the wall into the DC voltages the system's components need.\" },\n  { id: \"q10\", domainId: 4, text: \"In cloud computing, which service model provides virtualized computing resources like servers and storage over the internet?\", options: [\"SaaS\", \"PaaS\", \"IaaS\", \"DaaS\"], correct: 2, explain: \"IaaS (Infrastructure as a Service) delivers raw compute, storage, and networking resources.\" },\n  { id: \"q11\", domainId: 4, text: \"What is a hypervisor's primary role in virtualization?\", options: [\"Provide antivirus protection to VMs\", \"Create and manage virtual machines on physical hardware\", \"Assign IP addresses to VMs\", \"Back up VM data automatically\"], correct: 1, explain: \"A hypervisor creates, runs, and manages virtual machines by allocating host hardware resources to them.\" },\n  { id: \"q12\", domainId: 4, text: \"Which is a key resource requirement to consider before creating a virtual machine?\", options: [\"Available RAM and storage on the host\", \"Type of printer connected\", \"Monitor resolution\", \"Keyboard layout\"], correct: 0, explain: \"The host must have enough RAM, storage, and CPU headroom to support the new VM.\" },\n  { id: \"q13\", domainId: 5, text: \"What is the first step in the standard troubleshooting methodology?\", options: [\"Establish a theory of probable cause\", \"Identify the problem\", \"Document findings\", \"Test the solution\"], correct: 1, explain: \"Troubleshooting always starts with clearly identifying the problem before theorizing about causes.\" },\n  { id: \"q14\", domainId: 5, text: \"A desktop won't power on and there's no fan movement or lights. What should you check first?\", options: [\"The operating system boot order\", \"Power cable and outlet\", \"Installed applications\", \"Network cable\"], correct: 1, explain: \"With zero signs of power, the simplest and most likely cause is the power cable, outlet, or PSU switch.\" },\n  { id: \"q15\", domainId: 5, text: \"A laptop's screen shows a distorted image with flickering colors. Which component is most likely at fault?\", options: [\"Keyboard\", \"Display or video cable\", \"Battery\", \"Trackpad\"], correct: 1, explain: \"Flickering or distorted video points to the display panel or its video/ribbon cable.\" }\n];\n\nconst MOCK_MC = [\n{id:\"m1\",domainId:1,text:\"Which port/connector is most commonly used to charge and connect modern Android smartphones?\",options:[\"USB-C\",\"Lightning\",\"Micro-USB\",\"FireWire\"],correct:0,explain:\"Most current Android phones use USB-C for both charging and data.\"},\n{id:\"m2\",domainId:1,text:\"A laptop's battery is swelling and won't hold a charge. What is the safest immediate action?\",options:[\"Keep using it until it fully fails\",\"Replace it with a new, compatible battery\",\"Puncture it to release pressure\",\"Charge it overnight to test capacity\"],correct:1,explain:\"A swollen battery is a fire/chemical hazard and should be replaced, not charged or punctured.\"},\n{id:\"m3\",domainId:1,text:\"Which technology lets a smartphone share its cellular data connection with a laptop?\",options:[\"Tethering\",\"Synchronization\",\"NFC pairing\",\"Airplane mode\"],correct:0,explain:\"Tethering shares a mobile device's data connection with another device.\"},\n{id:\"m4\",domainId:1,text:\"Which wireless technology is most commonly used for contactless mobile payments?\",options:[\"NFC\",\"RFID\",\"Bluetooth\",\"Infrared\"],correct:0,explain:\"NFC enables the short-range, tap-to-pay communication used by mobile wallets.\"},\n{id:\"m5\",domainId:1,text:\"What is the main function of a digitizer in a touchscreen device?\",options:[\"Displays the image\",\"Converts touch input into signals the OS can interpret\",\"Regulates battery charging\",\"Provides Wi-Fi connectivity\"],correct:1,explain:\"The digitizer translates physical touch into input signals for the operating system.\"},\n{id:\"m6\",domainId:1,text:\"Which technology allows a company to enforce security policies and remotely wipe corporate data from employee-owned phones?\",options:[\"BYOD\",\"MDM\",\"VPN\",\"VLAN\"],correct:1,explain:\"Mobile Device Management (MDM) enforces policy and enables remote wipe.\"},\n{id:\"m7\",domainId:1,text:\"A tablet's touchscreen registers touches in the wrong location. What should be tried first?\",options:[\"Replace the digitizer\",\"Recalibrate the touchscreen\",\"Reinstall the OS\",\"Replace the battery\"],correct:1,explain:\"Calibration is a quick, non-invasive first step before replacing hardware.\"},\n{id:\"m8\",domainId:1,text:\"Which mobile connectivity feature uses a constellation of satellites to determine device location outdoors?\",options:[\"NFC\",\"GPS\",\"Bluetooth\",\"RFID\"],correct:1,explain:\"GPS uses satellites to provide precise outdoor location data.\"},\n{id:\"m9\",domainId:1,text:\"Which port type is reversible and supports both charging and high-speed data transfer on most modern phones?\",options:[\"Micro-USB\",\"Lightning\",\"USB-C\",\"Mini-USB\"],correct:2,explain:\"USB-C is reversible and widely used for charging and data.\"},\n{id:\"m10\",domainId:1,text:\"Which authentication method uses a unique physical trait, such as a fingerprint or face scan?\",options:[\"Biometric authentication\",\"Multi-factor token\",\"PIN authentication\",\"Pattern lock\"],correct:0,explain:\"Biometric authentication relies on unique physical characteristics.\"},\n{id:\"m11\",domainId:1,text:\"A company issues phones and wants only approved apps installed. Which MDM feature enforces this?\",options:[\"Remote wipe\",\"Application allowlisting\",\"Geofencing\",\"Firmware OTA update\"],correct:1,explain:\"Application allowlisting restricts installs to an approved app catalog.\"},\n{id:\"m12\",domainId:2,text:\"Which protocol automatically assigns IP addresses to devices on a network?\",options:[\"DNS\",\"DHCP\",\"SNMP\",\"SMTP\"],correct:1,explain:\"DHCP automatically assigns IP addresses and network settings.\"},\n{id:\"m13\",domainId:2,text:\"What is the purpose of a VLAN?\",options:[\"Encrypt traffic between two sites\",\"Logically segment a physical network into separate broadcast domains\",\"Translate domain names to IP addresses\",\"Assign public IP addresses automatically\"],correct:1,explain:\"A VLAN splits one physical network into multiple logical broadcast domains.\"},\n{id:\"m14\",domainId:2,text:\"A device has an IP address starting with 169.254. What does this indicate?\",options:[\"It has a valid DHCP lease\",\"It is using APIPA because DHCP failed\",\"It is a public IP address\",\"It is configured for IPv6\"],correct:1,explain:\"169.254.x.x is the APIPA range, self-assigned when DHCP is unreachable.\"},\n{id:\"m15\",domainId:2,text:\"Which device operates at Layer 2 and forwards traffic based on MAC address tables?\",options:[\"Hub\",\"Switch\",\"Router\",\"Repeater\"],correct:1,explain:\"A switch uses MAC address tables to forward frames at Layer 2.\"},\n{id:\"m16\",domainId:2,text:\"Which cable category supports Gigabit Ethernet up to 100 meters?\",options:[\"CAT3\",\"CAT5e\",\"CAT5\",\"Coaxial\"],correct:1,explain:\"CAT5e is rated for Gigabit Ethernet at 100-meter runs.\"},\n{id:\"m17\",domainId:2,text:\"What is the default subnet mask for a Class C IPv4 network?\",options:[\"255.0.0.0\",\"255.255.0.0\",\"255.255.255.0\",\"255.255.255.255\"],correct:2,explain:\"Class C networks default to a /24 mask, 255.255.255.0.\"},\n{id:\"m18\",domainId:2,text:\"Which port number is used by HTTPS traffic?\",options:[\"21\",\"80\",\"443\",\"25\"],correct:2,explain:\"HTTPS uses TCP port 443.\"},\n{id:\"m19\",domainId:2,text:\"Which wireless standard operates only in the 5 GHz band and offers higher throughput than 802.11n?\",options:[\"802.11a\",\"802.11ac\",\"802.11b\",\"802.11g\"],correct:1,explain:\"802.11ac operates in the 5 GHz band with higher throughput than 802.11n.\"},\n{id:\"m20\",domainId:2,text:\"What device translates private IP addresses to a public IP address for internet access?\",options:[\"Switch\",\"NAT router\",\"Access point\",\"Bridge\"],correct:1,explain:\"NAT translates private addresses to a public address.\"},\n{id:\"m21\",domainId:2,text:\"Which protocol resolves domain names to IP addresses?\",options:[\"DHCP\",\"DNS\",\"FTP\",\"SNMP\"],correct:1,explain:\"DNS resolves human-readable names to IP addresses.\"},\n{id:\"m22\",domainId:2,text:\"What is the purpose of a firewall's port forwarding rule?\",options:[\"Block all inbound traffic\",\"Direct external traffic on a specific port to an internal device\",\"Assign IP addresses automatically\",\"Encrypt traffic between routers\"],correct:1,explain:\"Port forwarding routes specific inbound traffic to an internal host.\"},\n{id:\"m23\",domainId:2,text:\"Which topology connects every device to a central switch or hub?\",options:[\"Bus\",\"Ring\",\"Star\",\"Mesh\"],correct:2,explain:\"A star topology connects all devices to a central point.\"},\n{id:\"m24\",domainId:2,text:\"What type of connector is commonly used for fiber optic patch cables with a push-pull latch?\",options:[\"ST\",\"SC\",\"RJ45\",\"BNC\"],correct:1,explain:\"SC connectors use a push-pull latching mechanism.\"},\n{id:\"m25\",domainId:2,text:\"Which technology allows remote users to securely access a private network over the internet?\",options:[\"VPN\",\"VLAN\",\"DMZ\",\"NAT\"],correct:0,explain:\"A VPN creates a secure tunnel to a private network over the internet.\"},\n{id:\"m26\",domainId:2,text:\"Which wireless security protocol is the current recommended standard, replacing WPA2?\",options:[\"WEP\",\"WPA\",\"WPA3\",\"TKIP\"],correct:2,explain:\"WPA3 is the current recommended wireless security standard.\"},\n{id:\"m27\",domainId:2,text:\"What does a DHCP lease renewal accomplish?\",options:[\"Assigns a permanent static IP\",\"Extends the client's use of its currently assigned IP information\",\"Resets the router's firmware\",\"Registers a new DNS record\"],correct:1,explain:\"Renewal extends the client's use of its current DHCP-assigned settings.\"},\n{id:\"m28\",domainId:2,text:\"Which network device operates at Layer 3 and forwards packets between different networks using IP addresses?\",options:[\"Switch\",\"Router\",\"Hub\",\"Repeater\"],correct:1,explain:\"Routers forward packets between networks based on IP addressing.\"},\n{id:\"m29\",domainId:2,text:\"Which addressing scheme uses 128-bit addresses written in hexadecimal, separated by colons?\",options:[\"IPv4\",\"IPv6\",\"MAC addressing\",\"APIPA\"],correct:1,explain:\"IPv6 uses 128-bit hexadecimal addresses.\"},\n{id:\"m30\",domainId:2,text:\"What is the purpose of a DMZ in network design?\",options:[\"Speeds up DNS resolution\",\"Hosts public-facing servers in a segment isolated from the internal network\",\"Assigns static IPs automatically\",\"Encrypts all internal traffic\"],correct:1,explain:\"A DMZ isolates public-facing servers from the internal network.\"},\n{id:\"m31\",domainId:2,text:\"Which internet connection type transmits data using coaxial cable shared with cable TV service?\",options:[\"DSL\",\"Cable\",\"Satellite\",\"Fiber\"],correct:1,explain:\"Cable internet shares coaxial infrastructure with cable TV.\"},\n{id:\"m32\",domainId:3,text:\"Which storage interface offers the fastest speeds by connecting directly to the PCIe bus?\",options:[\"SATA\",\"NVMe\",\"USB 2.0\",\"eSATA\"],correct:1,explain:\"NVMe drives connect directly to PCIe for much higher throughput than SATA.\"},\n{id:\"m33\",domainId:3,text:\"What is the main advantage of RAID 1?\",options:[\"Increased read/write speed only\",\"Data redundancy through disk mirroring\",\"Combines multiple disks into one large volume without redundancy\",\"Requires only one physical disk\"],correct:1,explain:\"RAID 1 mirrors data across disks for redundancy.\"},\n{id:\"m34\",domainId:3,text:\"Which component regulates and supplies power to all parts of a desktop computer?\",options:[\"Motherboard\",\"Power supply unit (PSU)\",\"CPU\",\"RAM module\"],correct:1,explain:\"The PSU converts AC power into the DC voltages components need.\"},\n{id:\"m35\",domainId:3,text:\"Which type of RAM must be installed in matched pairs to enable dual-channel mode?\",options:[\"Any DIMM\",\"ECC RAM\",\"DDR modules of matching speed/capacity\",\"SO-DIMM only\"],correct:2,explain:\"Dual-channel mode requires matched DDR modules.\"},\n{id:\"m36\",domainId:3,text:\"Which connector type is used to supply additional power directly to a modern graphics card?\",options:[\"SATA power\",\"Molex\",\"6/8-pin PCIe power connector\",\"24-pin ATX\"],correct:2,explain:\"Modern GPUs draw extra power through 6/8-pin PCIe connectors.\"},\n{id:\"m37\",domainId:3,text:\"What is the purpose of thermal paste when installing a CPU cooler?\",options:[\"Insulates electrical contacts\",\"Improves heat transfer between the CPU and heatsink\",\"Prevents dust buildup\",\"Increases clock speed\"],correct:1,explain:\"Thermal paste fills microscopic gaps to improve heat transfer.\"},\n{id:\"m38\",domainId:3,text:\"Which storage technology combines multiple physical drives into a single logical volume for redundancy or performance?\",options:[\"RAID\",\"NVMe\",\"SATA\",\"eSATA\"],correct:0,explain:\"RAID combines drives for redundancy and/or performance.\"},\n{id:\"m39\",domainId:3,text:\"Which expansion slot is commonly used for modern graphics cards?\",options:[\"PCI\",\"AGP\",\"PCIe x16\",\"ISA\"],correct:2,explain:\"PCIe x16 is the standard slot for modern GPUs.\"},\n{id:\"m40\",domainId:3,text:\"What is the function of a laptop's CMOS battery?\",options:[\"Powers the display backlight\",\"Maintains BIOS/UEFI settings and system clock when powered off\",\"Charges the main battery\",\"Regulates fan speed\"],correct:1,explain:\"The CMOS battery keeps firmware settings and the clock when unpowered.\"},\n{id:\"m41\",domainId:3,text:\"Which printer technology uses toner and a heated fuser to bond images to paper?\",options:[\"Inkjet\",\"Laser\",\"Thermal\",\"Impact\"],correct:1,explain:\"Laser printers use toner fused to paper with heat.\"},\n{id:\"m42\",domainId:3,text:\"Which cable type is used for internal SATA data connections?\",options:[\"7-pin flat data cable\",\"4-pin Molex\",\"24-pin ATX\",\"RJ45\"],correct:0,explain:\"SATA data cables use a thin 7-pin flat connector.\"},\n{id:\"m43\",domainId:3,text:\"What is the main advantage of an SSD over a traditional HDD?\",options:[\"Lower cost per gigabyte\",\"Faster read/write speeds and no moving parts\",\"Higher storage capacity\",\"Requires no power\"],correct:1,explain:\"SSDs are faster and have no moving parts, unlike HDDs.\"},\n{id:\"m44\",domainId:3,text:\"Which component converts AC power from a wall outlet into DC power for internal components?\",options:[\"Motherboard\",\"Power supply unit\",\"CPU\",\"RAM\"],correct:1,explain:\"The power supply unit converts AC to the DC voltages components need.\"},\n{id:\"m45\",domainId:3,text:\"Which peripheral connects using a small, keyed 4-pin round connector on older systems, largely replaced by USB?\",options:[\"PS/2\",\"VGA\",\"HDMI\",\"DVI\"],correct:0,explain:\"PS/2 connectors were used for keyboards/mice before USB became standard.\"},\n{id:\"m46\",domainId:3,text:\"Which form factor describes a standard full-size desktop motherboard?\",options:[\"Mini-ITX\",\"Micro-ATX\",\"ATX\",\"NUC\"],correct:2,explain:\"ATX is the standard full-size desktop motherboard form factor.\"},\n{id:\"m47\",domainId:3,text:\"When building a workstation for video editing, which upgrade provides the biggest performance benefit?\",options:[\"A faster mouse\",\"A multi-core CPU with ample RAM and fast storage\",\"A larger case\",\"Additional USB ports\"],correct:1,explain:\"Video editing benefits most from strong CPU, RAM, and fast storage.\"},\n{id:\"m48\",domainId:3,text:\"Which tool is used to safely discharge static electricity when handling internal components?\",options:[\"Multimeter\",\"Anti-static wrist strap\",\"Screwdriver\",\"Cable tester\"],correct:1,explain:\"An anti-static wrist strap protects components from ESD.\"},\n{id:\"m49\",domainId:3,text:\"What is the purpose of a heatsink and fan assembly on a CPU?\",options:[\"Increase processing speed directly\",\"Dissipate heat generated by the processor\",\"Provide power to the CPU\",\"Store cache data\"],correct:1,explain:\"A heatsink and fan dissipate heat produced by the CPU.\"},\n{id:\"m50\",domainId:3,text:\"Which memory type is soldered directly onto laptop motherboards in many ultrabooks, unlike desktop DIMMs?\",options:[\"SO-DIMM (socketed)\",\"Soldered LPDDR\",\"ECC UDIMM\",\"RDIMM\"],correct:1,explain:\"Many ultrabooks use soldered LPDDR memory instead of socketed modules.\"},\n{id:\"m51\",domainId:3,text:\"A custom PC build for a home theater system should prioritize which features?\",options:[\"Maximum CPU overclocking\",\"Compact case, quiet cooling, and HDMI output\",\"Multiple high-end GPUs\",\"Server-grade redundant power\"],correct:1,explain:\"A home theater PC favors a compact, quiet build with HDMI output.\"},\n{id:\"m52\",domainId:3,text:\"Which connector supplies main power to a desktop motherboard?\",options:[\"4-pin Molex\",\"24-pin ATX connector\",\"SATA power\",\"6-pin PCIe\"],correct:1,explain:\"The 24-pin ATX connector supplies main power to the motherboard.\"},\n{id:\"m53\",domainId:4,text:\"In cloud computing, which service model provides virtualized computing resources like servers and storage over the internet?\",options:[\"SaaS\",\"PaaS\",\"IaaS\",\"DaaS\"],correct:2,explain:\"IaaS delivers raw compute, storage, and networking resources.\"},\n{id:\"m54\",domainId:4,text:\"What is a hypervisor's primary role in virtualization?\",options:[\"Provide antivirus protection to VMs\",\"Create and manage virtual machines on physical hardware\",\"Assign IP addresses to VMs\",\"Back up VM data automatically\"],correct:1,explain:\"A hypervisor creates and manages VMs by allocating host resources.\"},\n{id:\"m55\",domainId:4,text:\"Which is a key resource requirement to consider before creating a virtual machine?\",options:[\"Available RAM and storage on the host\",\"Type of printer connected\",\"Monitor resolution\",\"Keyboard layout\"],correct:0,explain:\"The host needs sufficient RAM, storage, and CPU headroom.\"},\n{id:\"m56\",domainId:4,text:\"Which cloud characteristic allows resources to automatically increase or decrease based on demand?\",options:[\"Rapid elasticity\",\"Metered service\",\"Resource pooling\",\"Broad network access\"],correct:0,explain:\"Rapid elasticity lets resources scale automatically with demand.\"},\n{id:\"m57\",domainId:4,text:\"What is the purpose of a snapshot in virtualization?\",options:[\"Permanently deletes a VM\",\"Captures a VM's state at a point in time for rollback\",\"Increases VM's allocated RAM\",\"Migrates a VM to another host\"],correct:1,explain:\"A snapshot captures VM state so it can be rolled back later.\"},\n{id:\"m58\",domainId:4,text:\"Which cloud deployment model is dedicated to a single organization, hosted either on-site or by a provider?\",options:[\"Public cloud\",\"Private cloud\",\"Community cloud\",\"Hybrid cloud\"],correct:1,explain:\"A private cloud is dedicated to a single organization.\"},\n{id:\"m59\",domainId:4,text:\"What does \\\"resource pooling\\\" mean in cloud computing?\",options:[\"Each customer gets a dedicated physical server\",\"A provider's computing resources are shared dynamically among multiple customers\",\"Resources are billed at a flat monthly rate\",\"VMs cannot be moved between hosts\"],correct:1,explain:\"Resource pooling shares a provider's infrastructure among many customers.\"},\n{id:\"m60\",domainId:4,text:\"Which type of hypervisor runs directly on hardware without a host operating system?\",options:[\"Type 2 (hosted)\",\"Type 1 (bare-metal)\",\"Container-based\",\"Application virtualization\"],correct:1,explain:\"A Type 1 hypervisor runs directly on hardware.\"},\n{id:\"m61\",domainId:4,text:\"Why might an organization use client-side virtualization for software testing?\",options:[\"It requires no host resources\",\"It isolates test environments from the host OS, allowing safe experimentation\",\"It automatically backs up the internet\",\"It replaces the need for cloud storage\"],correct:1,explain:\"Client-side virtualization isolates test environments from the host OS.\"},\n{id:\"m62\",domainId:5,text:\"What is the first step in the standard troubleshooting methodology?\",options:[\"Establish a theory of probable cause\",\"Identify the problem\",\"Document findings\",\"Test the solution\"],correct:1,explain:\"Troubleshooting starts with clearly identifying the problem.\"},\n{id:\"m63\",domainId:5,text:\"A desktop won't power on and there's no fan movement or lights. What should you check first?\",options:[\"The operating system boot order\",\"Power cable and outlet\",\"Installed applications\",\"Network cable\"],correct:1,explain:\"With zero signs of power, check the power cable, outlet, or PSU first.\"},\n{id:\"m64\",domainId:5,text:\"A laptop's screen shows a distorted image with flickering colors. Which component is most likely at fault?\",options:[\"Keyboard\",\"Display or video cable\",\"Battery\",\"Trackpad\"],correct:1,explain:\"Distorted, flickering video points to the display panel or its cable.\"},\n{id:\"m65\",domainId:5,text:\"After identifying a problem, what is the next step in the troubleshooting methodology?\",options:[\"Document findings\",\"Establish a theory of probable cause\",\"Verify full system functionality\",\"Implement the solution\"],correct:1,explain:\"After identifying the problem, establish a theory of probable cause.\"},\n{id:\"m66\",domainId:5,text:\"A computer randomly reboots under heavy load. Which component should be tested first?\",options:[\"Keyboard\",\"RAM and power supply\",\"Optical drive\",\"Mouse\"],correct:1,explain:\"Random reboots under load often point to RAM or PSU issues.\"},\n{id:\"m67\",domainId:5,text:\"A user reports their monitor shows no signal, but the PC's fans are running. What should be checked first?\",options:[\"The motherboard battery\",\"The video cable connection and input source\",\"The hard drive\",\"The keyboard\"],correct:1,explain:\"Check the video cable and input source first when there's no signal.\"},\n{id:\"m68\",domainId:5,text:\"After replacing a failed hard drive, what is the final step in the troubleshooting process?\",options:[\"Establish a theory\",\"Document findings and outcomes\",\"Identify the problem\",\"Question the user\"],correct:1,explain:\"Documenting findings and outcomes closes out the troubleshooting process.\"},\n{id:\"m69\",domainId:5,text:\"A RAID 5 array reports one failed drive but continues operating. What should be done?\",options:[\"Nothing, no action needed\",\"Replace the failed drive promptly to restore redundancy\",\"Rebuild the entire array from scratch\",\"Disable RAID\"],correct:1,explain:\"Replace the failed drive promptly to restore redundancy before a second failure.\"},\n{id:\"m70\",domainId:5,text:\"A laptop screen displays vertical lines and intermittent flickering. What is most likely at fault?\",options:[\"The RAM\",\"The display panel or its cable\",\"The keyboard\",\"The battery\"],correct:1,explain:\"Vertical lines and flicker point to the display panel or its cable.\"},\n{id:\"m71\",domainId:5,text:\"A PC intermittently loses network connectivity, and the cable tests fine. What should be checked next?\",options:[\"The NIC driver and network adapter settings\",\"The monitor cable\",\"The power supply\",\"The RAM\"],correct:0,explain:\"With a good cable, check the NIC driver and adapter settings next.\"},\n{id:\"m72\",domainId:5,text:\"A system fails to POST and emits a series of beeps. What does this most likely indicate?\",options:[\"A software driver conflict\",\"A hardware fault detected during startup self-test\",\"A full hard drive\",\"An outdated OS\"],correct:1,explain:\"POST beep codes indicate a hardware fault found during self-test.\"},\n{id:\"m73\",domainId:5,text:\"Which tool would you use to test whether a power supply is outputting correct voltages?\",options:[\"Cable tester\",\"Multimeter\",\"Loopback plug\",\"Toner probe\"],correct:1,explain:\"A multimeter measures the PSU's output voltages directly.\"},\n{id:\"m74\",domainId:5,text:\"A network printer intermittently drops offline. What should be checked first?\",options:[\"The printer's static IP configuration and network connection\",\"The paper tray\",\"The toner cartridge\",\"The USB mouse\"],correct:0,explain:\"Check the printer's IP configuration and network connection first.\"},\n{id:\"m75\",domainId:5,text:\"A wireless connection is slow only in one part of the office. What is the most likely cause?\",options:[\"ISP outage\",\"Signal interference or weak coverage in that area\",\"Faulty Ethernet cable\",\"DNS misconfiguration\"],correct:1,explain:\"Localized slowness usually points to interference or weak coverage.\"},\n{id:\"m76\",domainId:5,text:\"After a storage drive begins clicking, what is the appropriate response?\",options:[\"Continue using it normally\",\"Back up data immediately, then replace the drive\",\"Defragment the drive\",\"Reformat the drive\"],correct:1,explain:\"Clicking noises suggest imminent failure; back up data immediately.\"},\n{id:\"m77\",domainId:5,text:\"A computer won't retain BIOS time/date settings after being powered off. What is most likely the cause?\",options:[\"Failing CMOS battery\",\"Corrupt OS installation\",\"Faulty RAM\",\"Bad network cable\"],correct:0,explain:\"A failing CMOS battery causes BIOS settings and the clock to reset.\"},\n{id:\"m78\",domainId:5,text:\"A newly installed expansion card causes the system to fail to boot. What should be checked first?\",options:[\"Reinstall the OS\",\"Ensure the card is fully seated and properly powered\",\"Replace the power supply\",\"Update the BIOS blindly\"],correct:1,explain:\"Check that the card is fully seated and powered before other steps.\"},\n{id:\"m79\",domainId:5,text:\"Two computers on the same switch cannot communicate, though both have valid IP addresses in the same subnet. What should be checked next?\",options:[\"The switch port configuration and cabling\",\"The DNS server\",\"The wallpaper settings\",\"The power supply\"],correct:0,explain:\"Check switch port configuration and cabling next.\"},\n{id:\"m80\",domainId:5,text:\"A user's laptop shuts down unexpectedly only when unplugged from AC power. What is most likely the cause?\",options:[\"Failing battery\",\"Bad keyboard\",\"Faulty webcam\",\"Loose HDMI cable\"],correct:0,explain:\"Shutting down only on battery power points to a failing battery.\"},\n{id:\"m81\",domainId:5,text:\"Which step should be taken before opening a desktop case to troubleshoot internal hardware?\",options:[\"Update all software\",\"Power off and unplug the system, then ground yourself\",\"Increase fan speed\",\"Run a virus scan\"],correct:1,explain:\"Always power off, unplug, and ground yourself before opening a case.\"},\n{id:\"m82\",domainId:5,text:\"A projector displays a dim, washed-out image even at full brightness.\",options:[\"The HDMI cable\",\"The projector's lamp/bulb\",\"The remote control\",\"The power strip\"],correct:1,explain:\"A dim, washed-out image usually means the lamp is aging or failing.\"},\n{id:\"m83\",domainId:5,text:\"After swapping RAM modules, a PC won't boot and beeps continuously. What should be checked first?\",options:[\"The hard drive\",\"Whether the RAM is fully and correctly seated in its slot\",\"The network cable\",\"The optical drive\"],correct:1,explain:\"Continuous beeping after a RAM swap usually means it isn't seated correctly.\"},\n{id:\"m84\",domainId:5,text:\"A mobile device overheats and shuts down after extended gaming. What is the most reasonable response?\",options:[\"Continue playing, it will resolve itself\",\"Let the device cool, avoid direct sunlight/cases that trap heat, and monitor for recurring overheating\",\"Replace the screen\",\"Reset all network settings\"],correct:1,explain:\"Let the device cool and address heat-trapping conditions.\"},\n{id:\"m85\",domainId:5,text:\"Which symptom most strongly suggests a failing power supply rather than a motherboard issue?\",options:[\"Random BSODs only\",\"Random shutdowns, no power at all, or burning smell from the PSU\",\"Slow boot times only\",\"Wi-Fi disconnects\"],correct:1,explain:\"Random shutdowns, no power, or a burning smell point to the PSU.\"}\n];\nconst MOCK_PBQ = [\n{id:\"p1\",domainId:2,text:\"You're setting up a small office network with one router, one switch, and 10 client PCs needing internet access and a shared printer. Describe the steps you'd take, from physical connections to verifying client connectivity.\",modelAnswer:\"Connect the router's WAN port to the ISP modem, connect the switch to a router LAN port, connect each PC to the switch via Ethernet, configure the router's SSID/security and DHCP scope, share the printer or connect it to the network, then verify each PC receives an IP via DHCP and can reach the printer and internet.\"},\n{id:\"p6\",domainId:2,text:\"Match each protocol to its standard port in your own words, and explain what each protocol is used for: HTTPS, DNS, SSH, RDP.\",modelAnswer:\"HTTPS - port 443, encrypted web traffic. DNS - port 53, resolves domain names to IP addresses. SSH - port 22, encrypted remote command-line access. RDP - port 3389, remote desktop/GUI access to Windows systems.\"},\n{id:\"p7\",domainId:3,text:\"You're building a budget desktop for basic office work (documents, browsing, video calls). List the component categories you'd prioritize and why, and any you'd deliberately spend less on.\",modelAnswer:\"Prioritize a modest multi-core CPU, 8-16GB RAM, and an SSD for boot/OS responsiveness. Spend less on the GPU (integrated graphics is enough for office work) and on a large PSU (a mid-wattage unit is sufficient without a discrete GPU).\"},\n{id:\"p8\",domainId:1,text:\"A field technician needs to configure a new company tablet for a traveling salesperson: it must have cellular data as a backup to Wi-Fi, be locatable if lost, and only run approved apps. List the settings/features you'd configure and why.\",modelAnswer:\"Enable cellular data as a fallback connection, enroll the device in MDM for location tracking and remote lock/wipe, and enable application allowlisting so only approved corporate apps can be installed.\"},\n{id:\"p9\",domainId:5,text:\"A desktop won't POST after a customer says they 'just cleaned the inside with a vacuum.' Walk through your troubleshooting methodology from identifying the problem to verifying the fix.\",modelAnswer:\"Identify the problem (no POST after cleaning), suspect electrostatic discharge damage or a dislodged component as the probable cause, test by reseating RAM/cards and checking for visible damage, establish a plan (reseat components, check for shorts, test with a known-good PSU if needed), implement the fix, verify the system POSTs and boots normally, and document that ESD-safe tools should be used for future cleaning.\"},\n{id:\"p10\",domainId:4,text:\"Your team wants to test a risky OS patch on a critical application server without affecting production if something goes wrong. Describe how you'd use virtualization to do this safely.\",modelAnswer:\"Clone or snapshot the production VM (or build an identical test VM on a separate host/network segment), apply the patch to the clone/snapshot only, test functionality thoroughly, and only roll the patch into production once verified — rolling back the snapshot immediately if problems appear.\"},\n{id:\"p2\",domainId:3,text:\"A customer wants to upgrade an aging desktop's storage without losing their OS and files. Describe how you would replace the HDD with an SSD, including data migration.\",modelAnswer:\"Back up the data, use cloning software to clone the HDD to the new SSD, physically install the SSD, set it as the primary boot device in BIOS/UEFI, boot from it to verify the migration, then repurpose or remove the old HDD.\"},\n{id:\"p3\",domainId:5,text:\"A user calls saying their PC randomly shuts down during video calls. Using the troubleshooting methodology, describe your approach from intake to resolution.\",modelAnswer:\"Identify the problem by asking about recent changes and error messages, establish a theory (overheating, failing PSU, or driver issue), test the theory by checking temperatures, event logs, and PSU output, establish a plan of action, implement the fix (clean fans, replace PSU, or update drivers), verify full functionality, and document the findings.\"},\n{id:\"p4\",domainId:4,text:\"Your company wants to test a new application safely without risking the production environment. Explain how virtualization would support this, and what you'd check beforehand.\",modelAnswer:\"Create a VM on a host using a hypervisor, first confirming the host has sufficient RAM, CPU, and storage headroom. Install the guest OS and application in the isolated VM, take a snapshot before testing, run the tests, and roll back the snapshot if issues occur — all without affecting the production environment.\"},\n{id:\"p5\",domainId:1,text:\"An employee's phone was lost with corporate email and files stored on it. Describe the steps to protect company data, referencing MDM capabilities.\",modelAnswer:\"Report the loss immediately, use MDM to attempt to locate the device, remotely lock it, and initiate a remote wipe of corporate data (or the full device, per policy). Revoke the account's credentials/tokens, notify the security team, and review MDM compliance policies going forward.\"}\n];\nconst EXTRA_MC = [\n{id:\"e1\",domainId:1,text:\"Which mobile OS feature restricts app installs to only those from an approved corporate catalog?\",options:[\"Geofencing\",\"Application allowlisting via MDM\",\"Remote wipe\",\"Full device encryption\"],correct:1,explain:\"MDM-enforced allowlisting restricts installs to approved apps.\"},\n{id:\"e2\",domainId:1,text:\"A user wants to pair a smartwatch with their phone. Which short-range wireless technology is typically used?\",options:[\"Bluetooth\",\"Cellular (LTE)\",\"Satellite\",\"Fiber\"],correct:0,explain:\"Bluetooth is the standard short-range pairing technology for wearables.\"},\n{id:\"e3\",domainId:1,text:\"Which mobile connectivity type provides internet access without relying on Wi-Fi or a cellular carrier's local towers, useful in remote areas?\",options:[\"NFC\",\"Satellite\",\"Bluetooth\",\"Infrared\"],correct:1,explain:\"Satellite connectivity works where cellular and Wi-Fi coverage is unavailable.\"},\n{id:\"e4\",domainId:1,text:\"What is the purpose of geofencing on a mobile device?\",options:[\"Encrypts data in transit\",\"Triggers actions when a device enters or leaves a defined geographic area\",\"Improves battery life\",\"Increases screen resolution\"],correct:1,explain:\"Geofencing triggers policies or alerts based on physical location boundaries.\"},\n{id:\"e5\",domainId:1,text:\"Which accessory allows a laptop with only USB-C ports to connect to an HDMI monitor, Ethernet, and additional USB devices simultaneously?\",options:[\"USB-C hub/dock\",\"Lightning adapter\",\"PS/2 adapter\",\"SATA-to-USB bridge\"],correct:0,explain:\"A USB-C dock/hub breaks a single port into multiple peripheral connections.\"},\n{id:\"e6\",domainId:1,text:\"A company wants employees to use personal phones for work email while retaining control over corporate data only. Which policy model best fits?\",options:[\"COPE\",\"BYOD with containerization\",\"Public kiosk mode\",\"Airplane mode enforcement\"],correct:1,explain:\"BYOD with containerization isolates corporate data on a personal device.\"},\n{id:\"e7\",domainId:1,text:\"Which sync method updates a mobile device's contacts and calendar automatically whenever changes are made on either the device or the cloud account?\",options:[\"Manual export\",\"Two-way cloud synchronization\",\"One-time USB transfer\",\"Bluetooth file transfer\"],correct:1,explain:\"Two-way cloud sync keeps data consistent across device and cloud in real time.\"},\n{id:\"e8\",domainId:1,text:\"A tablet's battery drains quickly even when idle. Which setting should be checked first?\",options:[\"Screen resolution\",\"Background app refresh and location services\",\"Wallpaper choice\",\"Font size\"],correct:1,explain:\"Background refresh and location services are common causes of excess battery drain.\"},\n{id:\"e9\",domainId:1,text:\"Which port is typically used on older Apple mobile devices for charging and data transfer, prior to widespread USB-C adoption?\",options:[\"Lightning\",\"Micro-USB\",\"USB-A\",\"eSATA\"],correct:0,explain:\"Lightning was Apple's proprietary connector before USB-C adoption.\"},\n{id:\"e10\",domainId:1,text:\"What is the primary risk of enabling an open, unsecured Wi-Fi hotspot on a mobile device?\",options:[\"Faster download speeds\",\"Traffic can be intercepted by nearby attackers\",\"Reduced battery drain\",\"Improved signal strength\"],correct:1,explain:\"Open hotspots lack encryption, exposing traffic to interception.\"},\n{id:\"e11\",domainId:1,text:\"Which feature lets a lost phone be located, locked, or wiped remotely by its owner?\",options:[\"Find My Device / similar remote management tool\",\"Airplane mode\",\"NFC pairing\",\"Screen mirroring\"],correct:0,explain:\"Remote-management/Find My Device features allow locating, locking, or wiping a lost phone.\"},\n{id:\"e12\",domainId:1,text:\"A user's phone screen doesn't rotate when the device is turned sideways. What should be checked first?\",options:[\"The SIM card\",\"Auto-rotate setting\",\"The charging port\",\"The SD card\"],correct:1,explain:\"Auto-rotate must be enabled for orientation changes to take effect.\"},\n{id:\"e13\",domainId:1,text:\"Which wireless technology is best suited for very short range, low-power communication like proximity unlocking or contactless payment?\",options:[\"NFC\",\"4G LTE\",\"5G mmWave\",\"802.11ac\"],correct:0,explain:\"NFC is designed for very short range, low-power interactions.\"},\n{id:\"e14\",domainId:1,text:\"A company enforces full-device encryption on all corporate phones. What does this primarily protect against?\",options:[\"Battery degradation\",\"Data exposure if the device is lost or stolen\",\"Slow charging speeds\",\"Screen cracking\"],correct:1,explain:\"Encryption protects stored data if the device falls into the wrong hands.\"},\n{id:\"e15\",domainId:1,text:\"Which connector type would you expect on a mobile device's SIM tray for a small removable cellular identity module?\",options:[\"Nano-SIM\",\"RJ11\",\"BNC\",\"DB-9\"],correct:0,explain:\"Modern phones typically use the nano-SIM form factor.\"},\n{id:\"e16\",domainId:1,text:\"Which best describes 'tethering' on a smartphone?\",options:[\"Locking the SIM to a single carrier\",\"Sharing the phone's mobile data connection with other devices\",\"Encrypting local storage\",\"Syncing photos to the cloud\"],correct:1,explain:\"Tethering shares a phone's data connection with other devices.\"},\n{id:\"e17\",domainId:1,text:\"A corporate phone policy requires remote wipe capability. Which management solution provides this?\",options:[\"MDM\",\"DNS\",\"VLAN\",\"NAT\"],correct:0,explain:\"MDM platforms provide remote wipe and other device management features.\"},\n{id:\"e18\",domainId:1,text:\"Which type of display is common on modern smartphones for better contrast and lower power use in dark scenes?\",options:[\"OLED\",\"CRT\",\"Plasma\",\"VGA\"],correct:0,explain:\"OLED displays offer strong contrast and can turn off individual pixels for true black.\"},\n{id:\"e19\",domainId:1,text:\"What should be verified first if a mobile hotspot won't let a laptop connect?\",options:[\"Correct Wi-Fi password and hotspot enabled\",\"Laptop's RAM amount\",\"CPU temperature\",\"Monitor resolution\"],correct:0,explain:\"Check that the hotspot is enabled and the password entered is correct first.\"},\n{id:\"e20\",domainId:1,text:\"Which accessory protects a phone's screen from scratches without significantly affecting touch sensitivity?\",options:[\"Case bumper\",\"Screen protector\",\"Popsocket\",\"Charging dock\"],correct:1,explain:\"A screen protector guards the display while preserving touch response.\"},\n{id:\"e21\",domainId:2,text:\"Which protocol is used to securely transfer files over an encrypted connection, as a secure alternative to FTP?\",options:[\"SFTP\",\"Telnet\",\"SNMP\",\"TFTP\"],correct:0,explain:\"SFTP transfers files over an encrypted SSH connection.\"},\n{id:\"e22\",domainId:2,text:\"What is the purpose of a subnet mask?\",options:[\"Encrypts network traffic\",\"Defines which portion of an IP address identifies the network vs. the host\",\"Assigns MAC addresses\",\"Resolves domain names\"],correct:1,explain:\"The subnet mask divides an IP address into network and host portions.\"},\n{id:\"e23\",domainId:2,text:\"Which wireless frequency band generally offers better range but more interference from other devices, compared to 5 GHz?\",options:[\"2.4 GHz\",\"60 GHz\",\"24 GHz\",\"900 MHz Wi-Fi\"],correct:0,explain:\"2.4 GHz travels farther but is more prone to interference from common devices.\"},\n{id:\"e23b\",domainId:2,text:\"Which port number is used by SMTP for sending email?\",options:[\"25\",\"110\",\"143\",\"443\"],correct:0,explain:\"SMTP traditionally uses TCP port 25.\"},\n{id:\"e24\",domainId:2,text:\"A company wants to isolate guest Wi-Fi traffic from the internal corporate network. What is the best solution?\",options:[\"Use the same SSID for both\",\"Create a separate VLAN/SSID for guest traffic\",\"Disable DHCP entirely\",\"Use only wired connections\"],correct:1,explain:\"A separate VLAN/SSID isolates guest traffic from the internal network.\"},\n{id:\"e25\",domainId:2,text:\"Which device extends wireless coverage by rebroadcasting an existing Wi-Fi signal?\",options:[\"Range extender/repeater\",\"Switch\",\"Patch panel\",\"Modem\"],correct:0,explain:\"A range extender rebroadcasts an existing signal to extend coverage.\"},\n{id:\"e26\",domainId:2,text:\"What is the primary function of a proxy server?\",options:[\"Assigns dynamic IP addresses\",\"Acts as an intermediary for client requests to other servers\",\"Provides physical network cabling\",\"Encrypts hard drive contents\"],correct:1,explain:\"A proxy server relays client requests, often for filtering or caching.\"},\n{id:\"e27\",domainId:2,text:\"Which type of cable uses light pulses to transmit data over long distances with minimal signal loss?\",options:[\"Coaxial\",\"Fiber optic\",\"CAT5e twisted pair\",\"Telephone (RJ11)\"],correct:1,explain:\"Fiber optic cable transmits data as light, allowing long distances with low loss.\"},\n{id:\"e28\",domainId:2
